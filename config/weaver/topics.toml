# Canonical topic taxonomy for the ruvnet npm portfolio (ADR-356).
#
# Every [[topic]] (kind = topic) was admitted on MEASURED demand, recorded
# below and in the weaver ledger (subject seo:topic:<slug>):
#   npm_kw_total     registry.npmjs.org/-/v1/search?text=keywords:<slug> `total`
#   npm_top5_monthly monthly downloads summed over that search's top 5 results
#   gh_topic_repos   gh api search/repositories q=topic:<slug> `total_count`
# A topic is kept only when npm_kw_total >= min_npm_kw_total OR
# gh_topic_repos >= min_gh_topic_repos, AND ruvnet packages genuinely ship
# the capability. Measured but rejected (below both floors): vector-db as a
# topic (45 / 99; kept as an alias), approximate-nearest-neighbor (16 / 86),
# quantum-simulation (4 / 415; alias of quantum-computing), swe-bench
# (35 / 400), sparse-matrix (7 / 499), linear-solver (2 / 12; alias of solver),
# graph-neural-network (18 / 486; alias of gnn), link-prediction (2 / 411) and
# graph-embeddings (0 / 91). Kind = niche admits an exact-feature long-tail term
# (a pilot theme such as link-prediction, or a real feature such as min-cut or
# csi) as a legal keyword: measured and recorded, never primary. Aliases are spelling variants of an admitted topic and need no
# demand of their own. kind = brand marks family names: legal keywords,
# never primary topics, exempt from the floor.
#
# Refresh: `weaver seo demand --taxonomy --record`.

[meta]
homepage = "https://ruv.io"
measured_at = "2026-11-08"
keywords_min = 8
keywords_max = 20
keywords_target = 16
repo_topics_max = 20
description_max = 200
stale_days = 180
min_npm_kw_total = 50
min_gh_topic_repos = 500
# Another lane owns these manifests: `propose` only, `apply` refuses.
hands_off_packages = ["ruvector", "@claude-flow/cli", "claude-flow", "ruflo"]
hands_off_repos = ["ruvnet/ruflo", "ruvnet/claude-flow", "ruvnet/metaharness"]

