# ---- explicit package mappings (entry points, flagships, pilots) ----
[[package]]
name = "agentdb"
primary = ["agent-memory", "vector-database", "ai-agents", "mcp", "self-learning", "rag"]
description = "Agent memory and vector database for AI agents: single-file HNSW search, episodic memory, causal graph, reinforcement learning and MCP tools."
flow = ["agent event", "episodic memory", "HNSW recall", "MCP tools"]

[[package]]
name = "agentic-flow"
primary = ["ai-agents", "llm-routing", "agent-orchestration", "coding-agent", "self-learning", "mcp"]
description = "AI agents runtime and meta-harness: routes each query to a cost-optimal model (LLM routing), evolves its own harness and orchestrates coding agents over MCP."
flow = ["query", "LLM routing", "agent harness", "verified result"]

[[package]]
name = "ruvector"
primary = ["vector-database", "vector-search", "embeddings", "hnsw", "mcp", "self-learning"]
description = "Self-learning vector database for Node.js: native HNSW vector search, ONNX embeddings, GNN, attention, SONA routing and an MCP server for agents."
flow = ["text or vector", "embeddings", "HNSW search", "ranked results"]

[[package]]
name = "@ruvector/rvf"
primary = ["vector-database", "vector-search", "hnsw", "typescript", "wasm"]
description = "RuVector Format (RVF): TypeScript SDK for a portable single-file vector database with HNSW vector search, native and WASM backends."
flow = ["vectors", "RVF file", "HNSW search", "top-k results"]

[[package]]
name = "@ruvector/rvf-node"
primary = ["vector-database", "napi", "hnsw", "rust", "nodejs"]
description = "Native Node.js (N-API) bindings for the RuVector Format vector database, built in Rust: HNSW indexing and search over portable .rvf files."

[[package]]
name = "@ruvector/ruvllm"
primary = ["local-llm", "llm", "self-learning", "lora", "inference", "llm-routing"]
description = "Local LLM runtime for Node.js: GGUF inference, KV-cache compression, SONA self-learning with LoRA, speculative decoding and an HTTP serve command."
flow = ["prompt", "router", "GGUF model", "tokens"]

[[package]]
name = "@ruvector/graph-node"
primary = ["graph-database", "knowledge-graph", "napi", "rust", "rag"]
description = "Native Node.js graph database bindings for RuVector: hypergraphs, Cypher queries, knowledge graph persistence, built in Rust."

[[package]]
name = "@ruvector/sona"
primary = ["self-learning", "lora", "llm-routing", "machine-learning", "napi"]
description = "SONA self-learning runtime: adaptive LoRA, EWC++ and ReasoningBank for LLM routing and AI systems, for Node.js and WASM."

[[package]]
name = "@ruvector/core"
primary = ["vector-database", "vector-search", "hnsw", "embeddings", "rust", "napi"]
description = "Vector database core with HNSW indexing, built in Rust with native Node.js bindings, for similarity search, semantic search and RAG."

[[package]]
name = "@ruvector/attention"
primary = ["attention", "transformer", "machine-learning", "napi", "rust"]
description = "Attention mechanisms for transformer models in Node.js: optimal transport, mixed curvature, topology, information geometry and diffusion variants, built in Rust."

[[package]]
name = "@ruvector/gnn"
primary = ["gnn", "machine-learning", "vector-database", "napi", "rust"]
description = "Graph neural network (GNN) layers for RuVector: native Node.js bindings for message passing and graph-aware vector search."

[[package]]
name = "@ruvector/kge"
primary = ["knowledge-graph", "embeddings", "gnn", "machine-learning", "typescript"]
description = "Knowledge graph embeddings and link prediction for Node.js: train on (head, relation, tail) triples and rank the most likely missing links."
flow = ["triples", "embedding model", "link scores", "ranked tails"]

[[package]]
name = "@ruvector/rvf-mcp-server"
primary = ["mcp-server", "vector-search", "mcp", "vector-database", "ai-agents"]
description = "MCP server for local vector search: expose a portable RVF index (HNSW) to Claude Code and other MCP clients as search and ingest tools."
flow = ["MCP client", "tools/call search", "RVF HNSW index", "ranked results"]

