# Capability table: domain keyword -> fabric package that implements it.
# `weaver scan` maps signals (404 imports, stub/fallback markers) to a
# candidate through this table; `weaver propose-new` treats a signal that
# matches NO entry as a capability gap. Keywords are case-insensitive regex
# fragments anchored at a word start (`\bkeyword`). `weight` scales the
# signal confidence (generic words such as "graph" get a low weight).

[[capability]]
package = "@ruvector/mincut-wasm"
category = "graph"
summary = "Weighted dynamic minimum cut with validated typed-array batches"
keywords = ["mincut", "min-cut", "min_cut", "minimum cut", "stoer", "karger", "graph partition"]
weight = 1.0

