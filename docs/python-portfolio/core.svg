<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Vector search — RuVector Python</title>
<desc id="desc">Index vectors. Retrieve neighbors. Getting started: Prepare vectors; Build an index; Query neighbors. Vector index and search. Decorative animation respects reduced motion preferences.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07191e"/><stop offset="1" stop-color="#0b2428"/></linearGradient><linearGradient id="line"><stop stop-color="#61e4cf"/><stop offset="1" stop-color="#b7ef69"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6edbce" stroke-opacity=".065"/></pattern></defs>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif}.eyebrow{font-size:14px;font-weight:650;letter-spacing:3px;fill:#64e4ce}.heading{font-size:43px;font-weight:700;letter-spacing:-1px;fill:#f0faf6}.subtitle{font-size:19px;fill:#aec8cc}.step{font-size:19px;font-weight:600;fill:#eaf7f4}.step-number{font-size:13px;font-weight:800;fill:#0b2227}.trace{stroke-dasharray:7 16;animation:travel 8s linear infinite}.halo{transform-origin:1070px 101px;animation:breathe 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-184}}@keyframes breathe{0%,100%{opacity:.45;transform:scale(.93)}50%{opacity:.9;transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){.trace,.halo{animation:none}}</style>
<rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/>
<path d="M48 0h1104" stroke="url(#line)" stroke-width="4"/>
<text x="48" y="47" class="eyebrow">RUVECTOR / PYTHON</text>
<text x="48" y="112" class="heading">Vector search</text><text x="48" y="149" class="subtitle">Index vectors. Retrieve neighbors.</text>
<g class="halo" fill="none" stroke="#64e4ce"><circle cx="1070" cy="101" r="60" stroke-opacity=".3"/><ellipse cx="1070" cy="101" rx="60" ry="23" transform="rotate(-35 1070 101)"/><ellipse cx="1070" cy="101" rx="60" ry="23" transform="rotate(35 1070 101)"/></g><circle cx="1070" cy="101" r="7" fill="#b7ef69"/>
<text x="48" y="204" fill="#87aab1" font-size="13" letter-spacing="1.2">GETTING STARTED / VECTOR INDEX AND SEARCH</text>
<path d="M72 279H1130" stroke="url(#line)" stroke-width="2" class="trace"/><g transform="translate(48,232)"><rect width="356" height="94" rx="16" fill="#10282e" stroke="#26474e"/><circle cx="30" cy="30" r="13" fill="#b7ef69"/><text x="30" y="35" class="step-number" text-anchor="middle">1</text><text x="22" y="71" class="step">Prepare vectors</text><path d="M308 27h22m-7-7 7 7-7 7" fill="none" stroke="#64e4ce" stroke-width="2"/></g><g transform="translate(422,232)"><rect width="356" height="94" rx="16" fill="#10282e" stroke="#26474e"/><circle cx="30" cy="30" r="13" fill="#b7ef69"/><text x="30" y="35" class="step-number" text-anchor="middle">2</text><text x="22" y="71" class="step">Build an index</text><path d="M308 27h22m-7-7 7 7-7 7" fill="none" stroke="#64e4ce" stroke-width="2"/></g><g transform="translate(796,232)"><rect width="356" height="94" rx="16" fill="#10282e" stroke="#26474e"/><circle cx="30" cy="30" r="13" fill="#b7ef69"/><text x="30" y="35" class="step-number" text-anchor="middle">3</text><text x="22" y="71" class="step">Query neighbors</text><path d="M308 27h22m-7-7 7 7-7 7" fill="none" stroke="#64e4ce" stroke-width="2"/></g>
<path d="M48 350H1152" stroke="#28474c"/><text x="48" y="377" fill="#8eaeb4" font-size="13">PYTHON INTERFACE</text><text x="1152" y="377" fill="#64e4ce" font-size="13" text-anchor="end">RUST CAPABILITIES / PRACTICAL QUICKSTARTS</text>
</svg>