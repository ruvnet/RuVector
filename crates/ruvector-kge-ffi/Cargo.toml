[package]
name = "ruvector-kge-ffi"
version = "2.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI-RS bindings for ruvector-kge (@ruvector/kge native binary)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ruvector-kge = { version = "2.4", path = "../ruvector-kge", features = ["parallel"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[build-dependencies]
napi-build = "2.1"
