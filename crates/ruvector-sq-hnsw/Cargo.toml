[package]
name = "ruvector-sq-hnsw"
version = "0.1.0"
edition = "2021"
description = "Scalar-quantized NSW graph search with two-stage full-precision re-ranking"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.release]
opt-level = 3
lto = "thin"
