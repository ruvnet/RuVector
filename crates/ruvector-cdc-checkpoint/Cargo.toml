[package]
name = "ruvector-cdc-checkpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
description = "Content-defined chunking for incremental, witness-chained snapshots of vector/graph indexes — bounded delta checkpoints for portable agent memory."
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
keywords = ["vector-database", "cdc", "snapshot", "agent-memory", "provenance"]
categories = ["database-implementations", "compression", "science"]

[dependencies]
sha2 = "0.10"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[lints.rust]
dead_code = "allow"

[lints.clippy]
pedantic = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
