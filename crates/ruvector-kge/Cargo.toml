[package]
name = "ruvector-kge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Holographic knowledge-graph embeddings (HolE / RotatE) for ruvector: scoring, training, evaluation, ANN candidate retrieval — one crate for native and wasm"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Multi-threaded 1-N kernel (plan M2). Off by default so the default build
# stays wasm32-safe; rayon is the workspace pin (lock: 1.12.0), no new copy.
parallel = ["dep:rayon"]

[dependencies]
ruvector-router-core = { version = "2.0", path = "../ruvector-router-core" }
ruvector-typesafe-core = { version = "2.0", path = "../ruvector-typesafe-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# FFT backend for HolE circular correlation (ADR-002 §3). Pinned to the exact
# version already resolved in the workspace lock (6.4.1) so no second copy is
# pulled. Licence: MIT OR Apache-2.0 (deny.toml allow-list). Compiles and runs
# on wasm32 — the ADR-002 hard gate — see the spike results in src/scorer/fft.rs.
rustfft = "=6.4.1"
# SGEMM core of the batched 1-N kernel (plan M2, `src/kernel/`). Pinned to the
# exact version already in the workspace lock (0.3.10) so no second copy is
# pulled. Licence: MIT OR Apache-2.0 (deny.toml allow-list). Pure Rust with
# runtime AVX/FMA dispatch; compiles on wasm32. Its own `threading` feature is
# deliberately NOT enabled: threads come only from our `parallel` feature so the
# reduction order stays fixed per output element (deterministic).
matrixmultiply = "=0.3.10"
rayon = { workspace = true, optional = true }
