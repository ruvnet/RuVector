[package]
name = "ruvector-kge-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native KGE benchmark binary (ADR-007 plan M3): pinned dataset loaders, ComplEx-N3-R training with valid-only early stopping, checkpoint/resume, tables-only export, receipts, and the ledger-gated --final / --verify-final test protocol"
# Internal tool: never published (plan M3, M9).
publish = false

[[bin]]
name = "ruvector-kge-bench"
path = "src/main.rs"

[[bin]]
name = "kge-ledger-check"
path = "src/bin/kge-ledger-check.rs"

[features]
# The bench is a native tool; the multi-threaded GEMM kernel is on by default.
# `--no-default-features` gives a single-threaded build.
default = ["parallel"]
parallel = ["ruvector-kge/parallel", "dep:rayon"]

[dependencies]
ruvector-kge = { version = "2.0", path = "../ruvector-kge" }
# ADR-004 anytime paired sequential test, reused by the HPO selection gate.
ruvector-typesafe-core = { version = "2.0", path = "../ruvector-typesafe-core" }
serde = { workspace = true }
# `float_roundtrip`: metrics restored from a checkpoint header must parse back
# to the exact f64 (resume equivalence compares them bitwise).
serde_json = { workspace = true, features = ["float_roundtrip"] }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true, optional = true }
# Pinned to versions already in the workspace lock (no new copies).
sha2 = "=0.10.9"
ureq = "=2.12.1"

[dev-dependencies]
tempfile = "3"
