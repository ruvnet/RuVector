[package]
name = "ruvector-matryoshka-rabitq"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Matryoshka coarse-to-fine ANN with a RaBitQ 1-bit brute-force coarse stage, measured against the HNSW-coarse baseline on recall, latency, and memory"
readme = "README.md"
keywords = ["vector-search", "ann", "matryoshka", "rabitq", "quantization"]
