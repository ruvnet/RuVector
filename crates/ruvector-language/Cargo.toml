[package]
name = "ruvector-language"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "RuGraph: bounded graph programs with typed evidence and replayable decisions"
repository = "https://github.com/ruvnet/RuVector"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Exercise host feature unification without requiring insertion-ordered maps in production.
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "rvg-core"
path = "src/main.rs"
