<path class="flow" d="M650 88L790 158L882 270M680 286L790 158L892 80"/>
<g fill="#142e40" stroke="#58edcf" stroke-width="2"><circle cx="650" cy="88" r="14"/><circle cx="892" cy="80" r="12"/><circle cx="882" cy="270" r="16"/><circle cx="680" cy="286" r="12"/><circle cx="906" cy="184" r="9"/></g>
<circle class="pulse" cx="790" cy="158" r="49" fill="#58edcf" opacity=".12"/><circle cx="790" cy="158" r="31" fill="#132f3d" stroke="#58edcf" stroke-width="2"/><text x="790" y="164" text-anchor="middle" font-size="16">rvg</text>
