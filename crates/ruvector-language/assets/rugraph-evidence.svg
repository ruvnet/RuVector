<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Four evidence states</title><desc id="desc">Supported means positive only; refuted means negative only; conflicting means both; unknown means neither. These are categories, not a mandatory sequence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#15172e"/></linearGradient><linearGradient id="ink"><stop stop-color="#58edcf"/><stop offset="1" stop-color="#95a7ff"/></linearGradient></defs>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#ecf3ff}.muted{fill:#a7b7ce}.line{stroke:#516b85;stroke-width:2;fill:none}.flow{stroke:#58edcf;stroke-width:3;fill:none;stroke-dasharray:8 22;animation:flow 5s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.45;transform:scale(.88)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<rect width="960" height="280" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="958" height="278" rx="23" fill="none" stroke="#2c4057"/>
<text x="36" y="43" font-size="24" font-weight="650">Evidence has four explicit states.</text><text x="36" y="72" font-size="15" class="muted">Positive and negative support are tracked independently for each claim.</text><rect x="36" y="103" width="210" height="115" rx="14" fill="#101e30" stroke="#58edcf"/><circle class="pulse" cx="61" cy="130" r="6" fill="#58edcf" style="animation-delay:0.0s"/><text x="53" y="163" font-size="22" font-weight="600">supported</text><text x="53" y="192" font-size="15" class="muted">Positive only</text><rect x="262" y="103" width="210" height="115" rx="14" fill="#101e30" stroke="#ff929e"/><circle class="pulse" cx="287" cy="130" r="6" fill="#ff929e" style="animation-delay:0.6s"/><text x="279" y="163" font-size="22" font-weight="600">refuted</text><text x="279" y="192" font-size="15" class="muted">Negative only</text><rect x="488" y="103" width="210" height="115" rx="14" fill="#101e30" stroke="#ffca78"/><circle class="pulse" cx="513" cy="130" r="6" fill="#ffca78" style="animation-delay:1.2s"/><text x="505" y="163" font-size="22" font-weight="600">conflicting</text><text x="505" y="192" font-size="15" class="muted">Both signs</text><rect x="714" y="103" width="210" height="115" rx="14" fill="#101e30" stroke="#a8b6d1"/><circle class="pulse" cx="739" cy="130" r="6" fill="#a8b6d1" style="animation-delay:1.7999999999999998s"/><text x="731" y="163" font-size="22" font-weight="600">unknown</text><text x="731" y="192" font-size="15" class="muted">Neither sign</text><text x="36" y="253" font-size="15" class="muted">Evidence expiry or deletion is reflected on the next execution. Predictions stay separate.</text></svg>