[package]
name = "ruvector-streaming-qng"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Online reservoir-sampled product quantization for streaming ANN: three measurable variants — full-precision, static-PQ, and adaptive streaming-PQ with distribution-drift resilience"
readme = "README.md"
keywords = ["vector-search", "ann", "product-quantization", "streaming", "agent-memory"]
