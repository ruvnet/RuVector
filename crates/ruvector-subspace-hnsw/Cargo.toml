[package]
name        = "ruvector-subspace-hnsw"
version     = "0.1.0"
edition     = "2021"
description = "Multi-subspace HNSW with coherence-weighted fusion — ruvector nightly 2026-06-12"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "hnsw", "subspace", "vector-search", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
