[workspace]
resolver = "2"
members = [
    "rvf-types",
    "rvf-wire",
    "rvf-manifest",
    "rvf-index",
    "rvf-quant",
    "rvf-crypto",
    "rvf-runtime",
    "rvf-kernel",
    "rvf-wasm",
    "rvf-solver-wasm",
    "rvf-witness-wasm",
    "rvf-node",
    "rvf-server",
    "rvf-import",
    "rvf-adapters/claude-flow",
    "rvf-adapters/agentdb",
    "rvf-adapters/ospipe",
    "rvf-adapters/agentic-flow",
    "rvf-adapters/rvlite",
    "rvf-adapters/sona",
    "rvf-launch",
    "rvf-ebpf",
    "rvf-cli",
    "tests/rvf-integration",
    "benches",
    "rvf-federation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
authors = ["ruv.io", "RuVector Team"]

[workspace.dependencies]
# Internal
rvf-types = { path = "rvf-types" }
rvf-wire = { path = "rvf-wire" }
rvf-manifest = { path = "rvf-manifest" }
rvf-index = { path = "rvf-index" }
rvf-quant = { path = "rvf-quant" }
rvf-crypto = { path = "rvf-crypto" }
rvf-runtime = { path = "rvf-runtime" }
rvf-adapter-claude-flow = { path = "rvf-adapters/claude-flow" }
rvf-adapter-agentdb = { path = "rvf-adapters/agentdb" }
rvf-adapter-ospipe = { path = "rvf-adapters/ospipe" }
rvf-adapter-agentic-flow = { path = "rvf-adapters/agentic-flow" }
rvf-adapter-rvlite = { path = "rvf-adapters/rvlite" }
rvf-adapter-sona = { path = "rvf-adapters/sona" }
rvf-import = { path = "rvf-import" }

# External
serde = { version = "1", default-features = false, features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32c = "0.6"
sha3 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
tempfile = "3"

# Size-optimized release overrides for edge/WASM cdylib crates. These were
# previously declared as `[profile.release]` inside each crate's own
# Cargo.toml, which Cargo silently ignores for non-root workspace members
# (see the "profiles for the non root package will be ignored" warning) --
# meaning rvf-wasm and rvf-solver-wasm have been shipping with the default
# release profile (opt-level=3, no strip) rather than the size-optimized
# one their own manifests claimed. `lto` is not an overridable per-package
# key in Cargo, so full LTO for just these crates isn't reachable this way;
# giving each its own standalone one-crate workspace (as `crates/rvf` itself
# is relative to the repo root workspace) would be the next step for that.
[profile.release.package.rvf-wasm]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.rvf-solver-wasm]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.rvf-witness-wasm]
opt-level = "z"
codegen-units = 1
strip = true
