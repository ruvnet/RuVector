[package]
name = "rvf-crypto"
version = "0.2.1"
edition = "2021"
description = "RuVector Format cryptographic primitives -- SHA-3 hashing and Ed25519 signing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
readme = "README.md"
categories = ["cryptography", "authentication"]
keywords = ["vector", "crypto", "sha3", "ed25519", "rvf"]
rust-version = "1.87"

[features]
default = ["std", "ed25519"]
std = ["sha3/std"]
ed25519 = ["dep:ed25519-dalek"]
# Hardware-accelerated SHA-256 (sha2 crate, runtime CPU detection) for the RVSD
# streaming path; byte-identical to the portable rvf_types::sha256 fallback.
fast-sha256 = ["dep:sha2"]

[dependencies]
rvf-types = { version = "0.2.3", path = "../rvf-types" }
sha3 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

# sha2 0.10 uses x86 SHA-NI through runtime detection, but on aarch64 it only uses
# the ARMv8 SHA-2 instructions with its `asm` feature; without it Apple silicon,
# Graviton and Pi 5 hash at the portable speed (~0.6 GB/s vs ~2.9 GB/s on an M4).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", default-features = false, optional = true, features = ["asm"] }

[dev-dependencies]
rand = "0.8"
