[package]
name = "rvf-runtime"
version = "0.5.4"
edition = "2021"
description = "RuVector Format runtime -- RvfStore API, compaction, and streaming I/O"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
readme = "README.md"
categories = ["database-implementations", "data-structures"]
keywords = ["vector", "database", "storage", "compaction", "rvf"]
rust-version = "1.87"

[features]
default = ["std", "ed25519"]
std = []
wasm = []
qr = []
ed25519 = ["rvf-types/ed25519"]

[dependencies]
rvf-types = { version = "0.3.0", path = "../rvf-types", features = ["std"] }
rvf-index = { version = "0.2.4", path = "../rvf-index", features = ["std"] }
rvf-quant = { version = "0.2.1", path = "../rvf-quant", features = ["std"] }
rvf-wire = { version = "0.2.0", path = "../rvf-wire" }
rvf-crypto = { version = "0.3.0", path = "../rvf-crypto", default-features = false }
log = "0.4"
crc32fast = "1"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[[example]]
name = "qr_seed_encode"
required-features = ["qr"]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
