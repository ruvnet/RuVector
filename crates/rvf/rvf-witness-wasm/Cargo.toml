[package]
name = "rvf-witness-wasm"
version = "0.1.0"
edition = "2021"
description = "Minimal Ed25519 witness signing/verification WASM module for RVF edge deployment (nightly research candidate)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
categories = ["wasm", "cryptography"]
keywords = ["wasm", "ed25519", "witness", "signing", "rvf"]
rust-version = "1.87"

[lib]
crate-type = ["cdylib"]

[dependencies]
rvf-types = { version = "0.2.0", path = "../rvf-types", default-features = false, features = ["alloc", "ed25519"] }
dlmalloc = { version = "0.2", features = ["global"] }

# Release profile for this crate is set via
# `[profile.release.package.rvf-witness-wasm]` at the rvf workspace root --
# a `[profile.release]` block here is silently ignored by Cargo for
# non-root workspace members.
