[package]
name = "rvf-wasm"
version = "0.1.0"
edition = "2021"
description = "RuVector Format WASM microkernel for browser and edge vector operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://github.com/ruvnet/ruvector"
readme = "README.md"
categories = ["wasm", "database-implementations"]
keywords = ["vector", "wasm", "webassembly", "embedding", "rvf"]
rust-version = "1.87"

[lib]
crate-type = ["cdylib"]

[dependencies]
rvf-types = { version = "0.2.0", path = "../rvf-types", default-features = false }
rvf-crypto = { version = "0.2.0", path = "../rvf-crypto", default-features = false }
dlmalloc = { version = "0.2", features = ["global"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
# Ed25519 witness signing/verification (nightly research candidate —
# off by default so the shipped microkernel artifact is unaffected).
witness-sign = ["dep:ed25519-dalek", "rvf-crypto/ed25519"]

# Release profile for this crate is set via `[profile.release.package.rvf-wasm]`
# at the rvf workspace root -- a `[profile.release]` block here is silently
# ignored by Cargo for non-root workspace members.
