[package]
name = "ruvector-language-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Real RuVector graph and KGE adapters for the RuGraph language"
repository = "https://github.com/ruvnet/RuVector"

[workspace]

[dependencies]
ruvector-language = { path = "../ruvector-language" }
ruvector-graph = { path = "../ruvector-graph", default-features = false }
ruvector-kge = { path = "../ruvector-kge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "rvg"
path = "src/main.rs"

[[bin]]
name = "rvg-model"
path = "src/model_main.rs"
