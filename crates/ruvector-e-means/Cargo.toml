[package]
name = "ruvector-e-means"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Deterministic CPU and WebAssembly e-means clustering with EMA centroid updates"
repository = "https://github.com/ruvnet/ruvector"
homepage = "https://ruv.io"
documentation = "https://docs.rs/ruvector-e-means"
keywords = ["clustering", "k-means", "ema", "quantization", "machine-learning"]
categories = ["algorithms", "science"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "LICENSE", "README.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
serde = ["dep:serde"]
wasm = ["serde", "dep:serde_json", "dep:wasm-bindgen"]

[dependencies]
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wasm-bindgen = { version = "=0.2.125", optional = true }

[dev-dependencies]
serde_json = "1.0"
