[package]
name = "ruvector-typesafe-train"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "OpenJev v0 trainer (ADR-008): fine-tunes bge-small-en-v1.5 in candle and transplants the weights into the pinned ONNX graph"
publish = false

[[bin]]
name = "openjev"
path = "src/main.rs"

[features]
default = []
# CUDA training (plan Step 0.1). CPU builds need no toolkit.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
# candle is pinned to the exact version already in Cargo.lock (via crates/ruvllm).
candle-core = "=0.9.2"
candle-nn = "=0.9.2"
# ONNX protobuf types only (ADR-008 §5); tract-transformers not needed.
tract-onnx = { version = "0.23", default-features = false }
prost = "0.14"
# Parity against the engine's own ort path, plus engine decisions.
ruvector-embed-core = { version = "2.3", path = "../ruvector-embed-core", features = ["native"] }
ruvector-typesafe-core = { version = "2.3", path = "../ruvector-typesafe-core" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
regex = "1.12"
unicode-normalization = "0.1"
toml = "0.8"
# Pinned-URL dataset/model download for `prep`/`fetch` (already in the lock via gpu-runner).
ureq = "2.12"
