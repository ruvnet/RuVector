<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc"><title id="title">RuVector tutorial: install, write, reopen, verify</title><desc id="desc">Install the selected backend. Write a record. Start a new process. Retrieve the persisted record. Four stages highlight in order.</desc><style>text{font-family:Arial,sans-serif}.step{animation:highlight 12s ease-in-out infinite}.s1{animation-delay:3s}.s2{animation-delay:6s}.s3{animation-delay:9s}@keyframes highlight{0%,20%,100%{fill:#214036;stroke:#5cf2c3}28%,92%{fill:#152238;stroke:#52617c}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style><rect width="900" height="190" rx="18" fill="#0b1222"/><text x="26" y="34" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / VERIFY THE MEMORY LOOP</text><text x="26" y="68" fill="#b9c9df" font-size="17">A second process should recover what the first one stored.</text><rect class="step s0" x="26" y="96" width="194" height="66" rx="12" stroke="#52617c" fill="#152238"/><text x="43" y="137" fill="#f2f6ff" font-size="23">1 / Install</text><path d="M223 129h15m-5 -5l5 5 -5 5" fill="none" stroke="#5cf2c3"/><rect class="step s1" x="243" y="96" width="194" height="66" rx="12" stroke="#52617c" fill="#152238"/><text x="260" y="137" fill="#f2f6ff" font-size="23">2 / Write</text><path d="M440 129h15m-5 -5l5 5 -5 5" fill="none" stroke="#5cf2c3"/><rect class="step s2" x="460" y="96" width="194" height="66" rx="12" stroke="#52617c" fill="#152238"/><text x="477" y="137" fill="#f2f6ff" font-size="23">3 / Reopen</text><path d="M657 129h15m-5 -5l5 5 -5 5" fill="none" stroke="#5cf2c3"/><rect class="step s3" x="677" y="96" width="194" height="66" rx="12" stroke="#52617c" fill="#152238"/><text x="694" y="137" fill="#f2f6ff" font-size="23">4 / Verify</text></svg>