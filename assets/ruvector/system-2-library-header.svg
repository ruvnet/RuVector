<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc"><title id="title">System 2: REASON & ORCHESTRATE</title><desc id="desc">Compose runtimes. Apply policy. Publish governed artifacts. Animated flow through Runtime + routing, Policy + receipts, Signed artifacts. Conceptual architecture.</desc><style>text{font-family:Arial,sans-serif}.flow{stroke-dasharray:9 8;animation:flow 3s linear infinite}.focus{animation:focus 9s ease-in-out infinite}.b{animation-delay:3s}.c{animation-delay:6s}@keyframes flow{to{stroke-dashoffset:-68}}@keyframes focus{0%,30%,100%{opacity:1}40%,90%{opacity:.45}}@media(prefers-reduced-motion:reduce){.flow,.focus{animation:none}}</style><rect width="1000" height="230" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 216H1000" stroke="#223047"/><text x="30" y="29" fill="#ffbe73" font-size="13" letter-spacing="3">RUVECTOR LIBRARY GUIDE / SYSTEM 2</text><text x="30" y="78" fill="#f2f6ff" font-size="29" font-weight="bold">REASON &amp; ORCHESTRATE</text><text x="30" y="105" fill="#abbad0" font-size="16">Compose runtimes. Apply policy. Publish governed artifacts.</text><path class="flow" d="M290 167H350M640 167H700" stroke="#ffbe73" stroke-width="3"/><g class="focus "><rect x="30" y="135" width="270" height="60" rx="12" fill="#162238" stroke="#ffbe73"/><circle cx="50" cy="165" r="5" fill="#ffbe73"/><text x="68" y="172" fill="#f2f6ff" font-size="18">Runtime + routing</text></g><g class="focus b"><rect x="365" y="135" width="270" height="60" rx="12" fill="#162238" stroke="#ffbe73"/><circle cx="385" cy="165" r="5" fill="#ffbe73"/><text x="403" y="172" fill="#f2f6ff" font-size="18">Policy + receipts</text></g><g class="focus c"><rect x="700" y="135" width="270" height="60" rx="12" fill="#162238" stroke="#ffbe73"/><circle cx="720" cy="165" r="5" fill="#ffbe73"/><text x="738" y="172" fill="#f2f6ff" font-size="18">Signed artifacts</text></g></svg>