<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Test the outcome, not just the animation.</title><desc>Choose a workload and measure quality alongside cost. Record recall, p95 latency and memory Compare against a tuned fixed baseline Promote changes only after evaluation Explorer timings and demo savings are not production performance guarantees.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:7 7;animation:flow 3s linear infinite}.step{opacity:.6}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes pulse{50%{opacity:.3}}.s0{animation:s0 9s linear infinite}@keyframes s0{0%,100%{opacity:.6}0.100%,33.233%{opacity:1}}.s1{animation:s1 9s linear infinite}@keyframes s1{0%,100%{opacity:.6}33.433%,66.566%{opacity:1}}.s2{animation:s2 9s linear infinite}@keyframes s2{0%,100%{opacity:.6}66.766%,99.899%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}.step{opacity:1}}</style><rect width="1200" height="420" fill="#05070c"/><rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#283140"/><text x="30" y="37" font-size="13" fill="#7ef0cf" letter-spacing="2">22 / 23  ·  VALIDATION</text><text x="29" y="82" font-size="31" fill="#f1f4f9" font-weight="700">Test the outcome, not just the</text><text x="29" y="119" font-size="31" fill="#f1f4f9" font-weight="700">animation.</text><text x="30" y="178" font-size="19" fill="#aab7ca" >Choose a workload and measure quality alongside</text><text x="30" y="202" font-size="19" fill="#aab7ca" >cost.</text><path d="M772 141C811 141 802 141 841 141" fill="none" stroke="#7ef0cf" stroke-width="2" class="flow"/><circle class="packet" r="4" fill="#ffad75"><animateMotion path="M772 141C811 141 802 141 841 141" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M963 141C1002 141 993 141 1032 141" fill="none" stroke="#7ef0cf" stroke-width="2