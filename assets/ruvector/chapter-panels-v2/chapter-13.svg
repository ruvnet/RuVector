<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Learning needs an outcome.</title><desc>SONA can adapt small weights from trajectories and rewards. Record what the agent tried Supply a success or quality signal Consolidate to protect useful learning Reading memory alone does not train weights or guarantee improvement.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:7 7;animation:flow 3s linear infinite}.step{opacity:.6}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes pulse{50%{opacity:.3}}.s0{animation:s0 9s linear infinite}@keyframes s0{0%,100%{opacity:.6}0.100%,33.233%{opacity:1}}.s1{animation:s1 9s linear infinite}@keyframes s1{0%,100%{opacity:.6}33.433%,66.566%{opacity:1}}.s2{animation:s2 9s linear infinite}@keyframes s2{0%,100%{opacity:.6}66.766%,99.899%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}.step{opacity:1}}</style><rect width="1200" height="420" fill="#05070c"/><rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#283140"/><text x="30" y="37" font-size="13" fill="#7ef0cf" letter-spacing="2">14 / 23  ·  SONA AND FEEDBACK</text><text x="29" y="82" font-size="31" fill="#f1f4f9" font-weight="700">Learning needs an outcome.</text><text x="30" y="178" font-size="19" fill="#aab7ca" >SONA can adapt small weights from trajectories</text><text x="30" y="202" font-size="19" fill="#aab7ca" >and rewards.</text><path d="M772 141C811 141 802 141 841 141" fill="none" stroke="#7ef0cf" stroke-width="2" class="flow"/><circle class="packet" r="4" fill="#ffad75"><animateMotion path="M772 141C811 141 802 141 841 141" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M963 141C1002 141 993 141 1032 141" fill="none" stroke="#7ef0cf" stroke-width="2" class="flow"/><circle class="packet" r="4" fill="#ffad75"><animateMotion path="M963 141C1002 141 993 141 1032 141" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle><g class="step s0"><rect x="650" y="114" width="122" height="54" rx="8" fill="#0d1420" stroke="#7ef0cf"/><text x="711" y="138" font-size="16" fill="#eaf0f7" text-anchor="middle">Trajectory</text></g><g class="step s1"><rect x="841" y="114" width="122" height="54" rx="8" fill="#0d1420" stroke="#7ef0cf"/><text x="902" y="138" font-size="16" fill="#eaf0f7" text-anchor="middle">Reward</text></g><g class="step s2"><rect x="1032" y="114" width="122" height="54" rx="8" fill="#0d1420" stroke="#7ef0cf"/><text x="1093" y="138" font-size="16" fill="#eaf0f7" text-anchor="middle">Adapter</text></g><path d="M1093 174C1093 260 711 260 711 174" fill="none" stroke="#ffad75" stroke-width="1.6" class="flow"/><path d="M29 281H1171" fill="none" stroke="#253042" stroke-width="1" /><g class="step s0"><text x="30" y="308" font-size="12" fill="#ffad75" >01</text><text x="61" y="309" font-size="16" fill="#dce3ef" >Record what the agent tried</text></g><g class="step s1"><text x="420" y="308" font-size="12" fill="#ffad75" >02</text><text x="451" y="309" font-size="16" fill="#dce3ef" >Supply a success or quality</text><text x="451" y="330" font-size="16" fill="#dce3ef" >signal</text></g><g class="step s2"><text x="810" y="308" font-size="12" fill="#ffad75" >03</text><text x="841" y="309" font-size="16" fill="#dce3ef" >Consolidate to protect useful</text><text x="841" y="330" font-size="16" fill="#dce3ef" >learning</text></g><text x="30" y="383" font-size="13" fill="#93a0b4" >Reading memory alone does not train weights or guarantee improvement.</text></svg>