<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">RuVector / CHOOSE YOUR DATA BOUNDARY</title><desc id="desc">Native, browser, and service deployments are separate surfaces with different controls. Conceptual illustration, not benchmark results.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#18334b" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 3s linear infinite}.stage{animation:stage 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes stage{0%,23%{stroke-opacity:1;fill-opacity:.13}30%,100%{stroke-opacity:.4;fill-opacity:.05}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="380" rx="16" fill="#080e19"/><rect width="1000" height="380" rx="16" fill="url(#grid)"/><text x="28" y="36" font-size="20" fill="#edf3ff">RuVector / CHOOSE YOUR DATA BOUNDARY</text><text x="28" y="60" font-size="12" fill="#a7b8ce">Native, browser, and service deployments are separate surfaces with different controls.</text><rect x="24" y="85" width="640" height="230" rx="14" fill="none" stroke="#9de8d0" stroke-dasharray="6 6"/><text x="44" y="111" font-size="14" fill="#9de8d0">LOCAL APPLICATION BOUNDARY</text><rect class="stage" style="animation-delay:0s" x="44" y="133" width="282" height="112" rx="12" fill="#9de8d0" fill-opacity=".05" stroke="#9de8d0" stroke-opacity=".4"/><text x="60" y="161" font-size="16" fill="#9de8d0">NATIVE APPLICATION</text><text x="60" y="191" font-size="13" fill="#b4c5da">Node.js / Rust / Python</text><text x="60" y="213" font-size="13" fill="#b4c5da">Local process + local files</text><rect class="stage" style="animation-delay:4s" x="348" y="133" width="290" height="112" rx="12" fill="#a5b5ff" fill-opacity=".05" stroke="#a5b5ff" stroke-opacity=".4"/><text x="364" y="161" font-size="16" fill="#a5b5ff">BROWSER APPLICATION</text><text x="364" y="191" font-size="13" fill="#b4c5da">@ruvector/wasm</text><text x="364" y="213" font-size="13" fill="#b4c5da">Browser storage boundary</text><rect class="stage" style="animation-delay:8s" x="710" y="133" width="260" height="112" rx="12" fill="#f6a675" fill-opacity=".05" stroke="#f6a675" stroke-opacity=".4"/><text x="726" y="161" font-size="16" fill="#f6a675">OPTIONAL SERVICES</text><text x="726" y="191" font-size="13" fill="#b4c5da">HTTP / PostgreSQL</text><text x="726" y="213" font-size="13" fill="#b4c5da">Shared Brain: hosted</text><path class="flow" d="M664 195H710" fill="none" stroke="#f6a675" stroke-width="2"/><text x="714" y="284" font-size="12" fill="#f6a675">Separate identity + data policy</text><text x="28" y="356" font-size="11" fill="#7f93ad">Offline deployments must prepopulate models. Backend support and maturity vary by package.</text></svg>