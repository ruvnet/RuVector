<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">RuVector / SYSTEM 0 + SYSTEM 1 + SYSTEM 2</title><desc id="desc">Complementary architecture roles. Select and integrate the components your workload needs. Conceptual illustration, not benchmark results.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#18334b" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 3s linear infinite}.stage{animation:stage 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes stage{0%,23%{stroke-opacity:1;fill-opacity:.13}30%,100%{stroke-opacity:.4;fill-opacity:.05}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="330" rx="16" fill="#080e19"/><rect width="1000" height="330" rx="16" fill="url(#grid)"/><text x="28" y="36" font-size="20" fill="#edf3ff">RuVector / SYSTEM 0 + SYSTEM 1 + SYSTEM 2</text><text x="28" y="60" font-size="12" fill="#a7b8ce">Complementary architecture roles. Select and integrate the components your workload needs.</text><rect class="stage" style="animation-delay:0s" x="28" y="92" width="280" height="112" rx="12" fill="#9de8d0" fill-opacity=".05" stroke="#9de8d0" stroke-opacity=".4"/><text x="44" y="120" font-size="16" fill="#9de8d0">SYSTEM 0 / RESPOND</text><text x="44" y="150" font-size="13" fill="#b4c5da">Embeddings and typed decisions</text><text x="44" y="172" font-size="13" fill="#b4c5da">Local observations</text><rect class="stage" style="animation-delay:4s" x="360" y="92" width="280" height="112" rx="12" fill="#a5b5ff" fill-opacity=".05" stroke="#a5b5ff" stroke-opacity=".4"/><text x="376" y="120" font-size="16" fill="#a5b5ff">SYSTEM 1 / REMEMBER</text><text x="376" y="150" font-size="13" fill="#b4c5da">Vector and graph memory</text><text x="376" y="172" font-size="13" fill="#b4c5da">Explicit feedback learning</text><rect class="stage" style="animation-delay:8s" x="692" y="92" width="280" height="112" rx="12" fill="#f6a675" fill-opacity=".05" stroke="#f6a675" stroke-opacity=".4"/><text x="708" y="120" font-size="16" fill="#f6a675">SYSTEM 2 / ORCHESTRATE</text><text x="708" y="150" font-size="13" fill="#b4c5da">Context for reasoning</text><text x="708" y="172" font-size="13" fill="#b4c5da">Coordination and evaluation</text><path class="flow" d="M308 150H360" fill="none" stroke="#9de8d0" stroke-width="2"/><path class="flow" d="M640 150H692" fill="none" stroke="#a5b5ff" stroke-width="2"/><path class="flow" d="M832 204V261H168V204" fill="none" stroke="#f6a675" stroke-width="2"/><text x="290" y="247" font-size="13" fill="#f6a675">Contrastive representations / feedback / validated change</text><text x="28" y="306" font-size="11" fill="#7f93ad">Conceptual map. These roles require explicit integration; research maturity varies by component.</text></svg>