<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">RuVector / LOCAL TYPED DECISIONS</title><desc id="desc">Use a bounded decision engine when classification or scoring fits the task. Conceptual illustration, not benchmark results.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#18334b" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 3s linear infinite}.stage{animation:stage 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes stage{0%,23%{stroke-opacity:1;fill-opacity:.13}30%,100%{stroke-opacity:.4;fill-opacity:.05}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="330" rx="16" fill="#080e19"/><rect width="1000" height="330" rx="16" fill="url(#grid)"/><text x="28" y="36" font-size="20" fill="#edf3ff">RuVector / LOCAL TYPED DECISIONS</text><text x="28" y="60" font-size="12" fill="#a7b8ce">Use a bounded decision engine when classification or scoring fits the task.</text><rect class="stage" style="animation-delay:0s" x="28" y="92" width="230" height="112" rx="12" fill="#9de8d0" fill-opacity=".05" stroke="#9de8d0" stroke-opacity=".4"/><text x="44" y="120" font-size="16" fill="#9de8d0">TEXT INPUT</text><text x="44" y="150" font-size="13" fill="#b4c5da">Ticket or intent</text><text x="44" y="172" font-size="13" fill="#b4c5da">Bounded task</text><rect class="stage" style="animation-delay:4s" x="310" y="92" width="330" height="112" rx="12" fill="#a5b5ff" fill-opacity=".05" stroke="#a5b5ff" stroke-opacity=".4"/><text x="326" y="120" font-size="16" fill="#a5b5ff">LOCAL DECISION ENGINE</text><text x="326" y="150" font-size="13" fill="#b4c5da">Embedding + decision heads</text><text x="326" y="172" font-size="13" fill="#b4c5da">Confidence + abstention</text><rect class="stage" style="animation-delay:8s" x="720" y="92" width="252" height="112" rx="12" fill="#f6a675" fill-opacity=".05" stroke="#f6a675" stroke-opacity=".4"/><text x="736" y="120" font-size="16" fill="#f6a675">TYPED OUTPUT</text><text x="736" y="150" font-size="13" fill="#b4c5da">choice / score / noul</text><text x="736" y="172" font-size="13" fill="#b4c5da">Application defined policy</text><path class="flow" d="M258 150H310" fill="none" stroke="#9de8d0" stroke-width="2"/><path class="flow" d="M640 150H720" fill="none" stroke="#a5b5ff" stroke-width="2"/><path class="flow" d="M475 204V259H830" fill="none" stroke="#f6a675" stroke-width="2"/><text x="502" y="246" font-size="13" fill="#f6a675">Abstain / escalate when required</text><text x="28" y="306" font-size="11" fill="#7f93ad">Separate package: @ruvector/typesafe. Calibrate on labeled data and a held out task split.</text></svg>