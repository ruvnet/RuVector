<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/exotic-wasm — Exotic AI mechanisms in WebAssembly: Neural Autonomous Organizations, morphogenetic networks, time crystals.</title><desc id="desc">Animated RuVector package banner. Agent nodes pulse in turn and are linked by consensus edges, illustrating oscillator synchronisation in a Neural Autonomous Organization.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5);opacity:1}}@media(prefers-reduced-motion:reduce){.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / NAO / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/exotic-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">Neural Autonomous Organizations, morphogenetic</text><text x="30" y="148" fill="#abbad0" font-size="16">networks and time crystals, in WebAssembly.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/exotic-wasm</text>
