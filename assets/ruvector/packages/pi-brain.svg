<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/pi-brain — CLI and SDK for π, the RuVector shared brain — share, search and transfer learning across AI sessions.</title><desc id="desc">Animated RuVector package banner. Several sessions send knowledge into a pulsing central π brain.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@media(prefers-reduced-motion:reduce){.wire,.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SHARED BRAIN</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/pi-brain</text><text x="30" y="126" fill="#abbad0" font-size="16">CLI and SDK for π, the RuVector shared brain — share, search and</text><text x="30" y="148" fill="#abbad0" font-size="16">transfer learning across AI sessions.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/pi-brain</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path class="wire" style="animation-delay:0s" d="M640 80L785 128"/><path class="wire" style="animation-delay:0.5s" d="M640 176L785 128"/><path class="wire" style="animation-delay:1s" d="M785 74L785 128"/><path class="wire" style="animation-delay:1.5s" d="M930 80L785 128"/><path class="wire" style="animation-delay:2s" d="M930 176L785 128"/><g class="lit" style="animation-delay:0s"><rect x="606" y="69" width="68" height="22" rx="7" fill="#162238" stroke="#bd9bff"/><text x="640" y="83.6" fill="#f2f6ff" font-size="10" text-anchor="middle">session</text></g><g class="lit" style="animation-delay:1s"><rect x="606" y="165" width="68" height="22" rx="7" fill="#162238" stroke="#bd9bff"/><text x="640" y="179.6" fill="#f2f6ff" font-size="10" text-anchor="middle">session</text></g><g class="lit" style="animation-delay:2s"><rect x="751" y="63" width="68" height="22" rx="7" fill="#162238" stroke="#bd9bff"/><text x="785" y="77.6" fill="#f2f6ff" font-size="10" text-anchor="middle">session</text></g><g class="lit" style="animation-delay:3s"><rect x="896" y="69" width="68" height="22" rx="7" fill="#162238" stroke="#bd9bff"/><text x="930" y="83.6" fill="#f2f6ff" font-size="10" text-anchor="middle">session</text></g><g class="lit" style="animation-delay:4s"><rect x="896" y="165" width="68" height="22" rx="7" fill="#162238" stroke="#bd9bff"/><text x="930" y="179.6" fill="#f2f6ff" font-size="10" text-anchor="middle">session</text></g><circle cx="785" cy="128" r="22" fill="none" stroke="#5cf2c3" class="pulse"/><circle cx="785" cy="128" r="20" fill="#162238" stroke="#5cf2c3"/><text x="785" y="135" fill="#5cf2c3" font-size="20" text-anchor="middle">π</text><text x="785" y="204" fill="#8297b1" font-size="11" text-anchor="middle">share · search · transfer, with a witness chain</text></svg>
