<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/rvf-node — Native Node.js bindings for the RuVector Format (RVF) vector database, built with Rust via N-API.</title><desc id="desc">Animated RuVector package banner. Calls from Node.js flow over a segmented RVF container whose segments light in turn.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / RVF / NATIVE BINDINGS</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/rvf-node</text><text x="30" y="126" fill="#abbad0" font-size="16">Native Node.js bindings for the RuVector Format (RVF) vector</text><text x="30" y="148" fill="#abbad0" font-size="16">database, built with Rust via N-API.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/rvf-node</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="620" y="104" width="330" height="48" rx="10" fill="none" stroke="#bd9bff"/><g class="lit" style="animation-delay:0s"><rect x="624" y="108" width="74.5" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="661.3" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">VEC</text></g><g class="lit" style="animation-delay:0.9s"><rect x="706.5" y="108" width="74.5" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="743.8" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">INDEX</text></g><g class="lit" style="animation-delay:1.8s"><rect x="789" y="108" width="74.5" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="826.3" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">MANIFEST</text></g><g class="lit" style="animation-delay:2.7s"><rect x="871.5" y="108" width="74.5" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="908.8" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">WITNESS</text></g><path class="wire" d="M640 80H930"/><text x="620" y="74" fill="#8297b1" font-size="11">Node.js → N-API</text><text x="616" y="182" fill="#8297b1" font-size="12">Rust RVF engine via N-API · native speed</text></svg>
