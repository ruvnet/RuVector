<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/node — Unified RuVector package for Node.js — high-performance vector database with GNN capabilities.</title><desc id="desc">Animated RuVector package banner. Messages pass along graph edges as nodes light up in turn.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / NODE.JS</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/node</text><text x="30" y="126" fill="#abbad0" font-size="16">Unified RuVector package for Node.js — high-performance vector</text><text x="30" y="148" fill="#abbad0" font-size="16">database with GNN capabilities.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/node</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M660 90L760 130" stroke="#374354" /><path d="M660 170L760 130" stroke="#374354" /><path d="M760 130L860 85" stroke="#374354" /><path d="M760 130L860 175" stroke="#374354" /><path d="M860 85L930 130" stroke="#374354" /><path d="M860 175L930 130" stroke="#374354" /><path d="M660 90L760 130" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:0s"/><path d="M660 170L760 130" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:0.6s"/><path d="M760 130L860 85" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:1.2s"/><path d="M760 130L860 175" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:1.8s"/><path d="M860 85L930 130" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:2.4s"/><path d="M860 175L930 130" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:3s"/><circle cx="660" cy="90" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0s"/><circle cx="660" cy="170" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0.6s"/><circle cx="760" cy="130" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1.2s"/><circle cx="860" cy="85" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1.8s"/><circle cx="860" cy="175" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2.4s"/><circle cx="930" cy="130" r="6" fill="#5cf2c3" class="lit" style="animation-delay:3s"/><text x="616" y="200" fill="#8297b1" font-size="12">HNSW search + GNN message passing</text><path class="wire" d="M660 90L760 130L860 85L930 130"/></svg>
