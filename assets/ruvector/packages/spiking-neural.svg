<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/spiking-neural — High-performance spiking neural network (SNN) library with SIMD optimization — CLI and SDK.</title><desc id="desc">Animated RuVector package banner. Spike trains flow along four neuron rows of a raster plot.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.spk{fill:none;stroke-width:12;animation:flow 2.4s linear infinite}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-60}}@media(prefers-reduced-motion:reduce){.lit,.spk{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SPIKING NEURAL NETWORKS</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/spiking-neural</text><text x="30" y="126" fill="#abbad0" font-size="16">High-performance spiking neural network (SNN) library with SIMD</text><text x="30" y="148" fill="#abbad0" font-size="16">optimization — CLI and SDK.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/spiking-neural</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><circle cx="630" cy="78" r="7" fill="#bd9bff" class="lit" style="animation-delay:0s"/><path class="spk" stroke="#5cf2c3" stroke-dasharray="2 22" d="M645 78H950"/><path d="M645 78H950" stroke="#374354" stroke-width=".5"/><circle cx="630" cy="106" r="7" fill="#bd9bff" class="lit" style="animation-delay:0.9s"/><path class="spk" stroke="#ffbe73" stroke-dasharray="3 15" d="M645 106H950"/><path d="M645 106H950" stroke="#374354" stroke-width=".5"/><circle cx="630" cy="134" r="7" fill="#bd9bff" class="lit" style="animation-delay:1.8s"/><path class="spk" stroke="#5cf2c3" stroke-dasharray="2 30" d="M645 134H950"/><path d="M645 134H950" stroke="#374354" stroke-width=".5"/><circle cx="630" cy="162" r="7" fill="#bd9bff" class="lit" style="animation-delay:2.7s"/><path class="spk" stroke="#ffbe73" stroke-dasharray="4 18" d="M645 162H950"/><path d="M645 162H950" stroke="#374354" stroke-width=".5"/><path d="M645 70V170" stroke="#374354"/><text x="616" y="200" fill="#8297b1" font-size="11">leaky integrate-and-fire neurons · STDP learning</text></svg>
