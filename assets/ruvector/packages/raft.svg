<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/raft — Raft consensus for distributed systems — leader election, log replication and fault tolerance.</title><desc id="desc">Animated RuVector package banner. A leader pulses heartbeats to four followers that acknowledge in turn.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@media(prefers-reduced-motion:reduce){.wire,.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / CONSENSUS</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/raft</text><text x="30" y="126" fill="#abbad0" font-size="16">Raft consensus for distributed systems — leader election, log</text><text x="30" y="148" fill="#abbad0" font-size="16">replication and fault tolerance.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/raft</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path class="wire" d="M785 128L650 85" style="animation-delay:0s"/><path class="wire" d="M785 128L650 170" style="animation-delay:0.3s"/><path class="wire" d="M785 128L920 85" style="animation-delay:0.6s"/><path class="wire" d="M785 128L920 170" style="animation-delay:0.8999999999999999s"/><g class="lit" style="animation-delay:0s"><rect x="610" y="73" width="80" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="650" y="88.96" fill="#f2f6ff" font-size="11" text-anchor="middle">follower</text></g><g class="lit" style="animation-delay:0.8s"><rect x="610" y="158" width="80" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="650" y="173.96" fill="#f2f6ff" font-size="11" text-anchor="middle">follower</text></g><g class="lit" style="animation-delay:1.6s"><rect x="880" y="73" width="80" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="920" y="88.96" fill="#f2f6ff" font-size="11" text-anchor="middle">follower</text></g><g class="lit" style="animation-delay:2.4s"><rect x="880" y="158" width="80" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="920" y="173.96" fill="#f2f6ff" font-size="11" text-anchor="middle">follower</text></g><circle cx="785" cy="128" r="20" fill="none" stroke="#5cf2c3" class="pulse"/><g ><rect x="740" y="114" width="90" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="785" y="132.68" fill="#f2f6ff" font-size="13" text-anchor="middle">leader</text></g><text x="785" y="200" fill="#8297b1" font-size="11" text-anchor="middle">heartbeat · append entries · commit on quorum</text></svg>
