<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/all — Opt-in umbrella bundle that installs the whole RuVector toolkit in one go.</title><desc id="desc">Animated RuVector package banner. Package chips light up in turn and flow into a single install command.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / UMBRELLA BUNDLE</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/all</text><text x="30" y="126" fill="#abbad0" font-size="16">Opt-in umbrella bundle that installs the whole RuVector toolkit</text><text x="30" y="148" fill="#abbad0" font-size="16">in one go.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/all</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0s"><rect x="615" y="66" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="670" y="82.96" fill="#f2f6ff" font-size="11" text-anchor="middle">ruvector</text></g><g class="lit" style="animation-delay:0.5s"><rect x="735" y="66" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="790" y="82.96" fill="#f2f6ff" font-size="11" text-anchor="middle">rvf</text></g><g class="lit" style="animation-delay:1s"><rect x="855" y="66" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="910" y="82.96" fill="#f2f6ff" font-size="11" text-anchor="middle">sona</text></g><g class="lit" style="animation-delay:1.5s"><rect x="615" y="100" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="670" y="116.96" fill="#f2f6ff" font-size="11" text-anchor="middle">graph</text></g><g class="lit" style="animation-delay:2s"><rect x="735" y="100" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="790" y="116.96" fill="#f2f6ff" font-size="11" text-anchor="middle">rvlite</text></g><g class="lit" style="animation-delay:2.5s"><rect x="855" y="100" width="110" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="910" y="116.96" fill="#f2f6ff" font-size="11" text-anchor="middle">router</text></g><path class="wire" d="M785 136V156"/><g ><rect x="680" y="158" width="210" height="34" rx="7" fill="#162238" stroke="#ffbe73"/><text x="785" y="180.04" fill="#f2f6ff" font-size="14" text-anchor="middle">npm i @ruvector/all</text></g></svg>
