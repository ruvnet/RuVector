<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/diskann — DiskANN / Vamana — SSD-friendly approximate nearest-neighbour search with product quantization.</title><desc id="desc">Animated RuVector package banner. Graph hops light up across nodes held in memory while full vectors are fetched from an SSD.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / BILLION-SCALE ANN</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/diskann</text><text x="30" y="126" fill="#abbad0" font-size="16">DiskANN / Vamana — SSD-friendly approximate nearest-neighbour</text><text x="30" y="148" fill="#abbad0" font-size="16">search with product quantization.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/diskann</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M630 80L690 110" stroke="#374354" /><path d="M690 110L750 78" stroke="#374354" /><path d="M750 78L810 108" stroke="#374354" /><path d="M810 108L870 82" stroke="#374354" /><path d="M870 82L930 112" stroke="#374354" /><path d="M630 80L690 110" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:0s"/><path d="M690 110L750 78" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:0.8s"/><path d="M750 78L810 108" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:1.6s"/><path d="M810 108L870 82" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:2.4s"/><path d="M870 82L930 112" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:3.2s"/><circle cx="630" cy="80" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0s"/><circle cx="690" cy="110" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0.8s"/><circle cx="750" cy="78" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1.6s"/><circle cx="810" cy="108" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2.4s"/><circle cx="870" cy="82" r="6" fill="#5cf2c3" class="lit" style="animation-delay:3.2s"/><circle cx="930" cy="112" r="6" fill="#5cf2c3" class="lit" style="animation-delay:4s"/><text x="612" y="66" fill="#8297b1" font-size="11">PQ codes in RAM</text><path class="wire" d="M690 118V160" style="animation-delay:0s"/><path class="wire" d="M810 116V160" style="animation-delay:0.8s"/><path class="wire" d="M930 120V160" style="animation-delay:1.6s"/><path d="M620 160H950" stroke="#bd9bff"/><g fill="#162238" stroke="#bd9bff"><path d="M860 168v14a45 7 0 0 0 90 0v-14"/><ellipse cx="905" cy="168" rx="45" ry="7"/></g><text x="905" y="183" fill="#f2f6ff" font-size="12" text-anchor="middle">SSD</text><text x="616" y="202" fill="#8297b1" font-size="11">Vamana hops → full vectors on disk</text></svg>
