<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">ruvector-rairs — IVF with redundant assignment and amplified inverse residual</title><desc id="desc">Animated RuVector crate banner. Points link to a primary centroid and, with a dashed line, to a secondary centroid.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / CRATE / IVF INDEX</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">ruvector-rairs</text><text x="30" y="126" fill="#abbad0" font-size="16">IVF-Flat, RAIRS and SEIL indexes for low-nprobe recall.</text><text x="30" y="148" fill="#abbad0" font-size="16">Vectors get a primary and a secondary list; SEIL shares blocks.</text><text x="30" y="200" fill="#8297b1" font-size="14">cargo add ruvector-rairs</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><circle cx="660" cy="100" r="9" fill="#5cf2c3"/><circle cx="760" cy="150" r="9" fill="#5cf2c3"/><circle cx="860" cy="95" r="9" fill="#5cf2c3"/><circle cx="930" cy="165" r="9" fill="#5cf2c3"/><g class="lit" style="animation-delay:0.0s"><circle cx="700" cy="125" r="5" fill="#f2f6ff"/><path d="M700 125L660 100" stroke="#5cf2c3" stroke-width="2"/><path class="wire" d="M700 125L760 150" style="stroke:#bd9bff"/></g><g class="lit" style="animation-delay:1.2s"><circle cx="810" cy="120" r="5" fill="#f2f6ff"/><path d="M810 120L760 150" stroke="#5cf2c3" stroke-width="2"/><path class="wire" d="M810 120L860 95" style="stroke:#bd9bff"/></g><g class="lit" style="animation-delay:2.4s"><circle cx="890" cy="130" r="5" fill="#f2f6ff"/><path d="M890 130L860 95" stroke="#5cf2c3" stroke-width="2"/><path class="wire" d="M890 130L930 165" style="stroke:#bd9bff"/></g><g class="lit" style="animation-delay:3.6s"><circle cx="720" cy="160" r="5" fill="#f2f6ff"/><path d="M720 160L760 150" stroke="#5cf2c3" stroke-width="2"/><path class="wire" d="M720 160L660 100" style="stroke:#bd9bff"/></g><text x="616" y="200" fill="#8297b1" font-size="11">primary list + residual-amplified secondary list</text></svg>
