<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/ruvllm — self-learning LLM runtime for Node.js with GGUF inference, SONA, TurboQuant KV cache and an optional GPU job loop.</title><desc id="desc">Animated RuVector package banner. The @ruvector/ruvllm runtime routes a request through SONA, the KV cache and GGUF inference; a dashed link to the optional @ruvector/ruvllm-gpu-loop package lights up for GPU jobs.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.opt{fill:none;stroke:#bd9bff;stroke-width:2;stroke-dasharray:4 6;animation:flow 4s linear infinite}.lit{animation:lit 6s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.35}12%,40%{opacity:1}}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@media(prefers-reduced-motion:reduce){.wire,.opt,.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / LLM RUNTIME</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/ruvllm</text><text x="30" y="126" fill="#abbad0" font-size="16">Self-learning LLM runtime for Node.js — GGUF inference,</text><text x="30" y="148" fill="#abbad0" font-size="16">SONA, TurboQuant KV cache, serve, plus the GPU job loop.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/ruvllm</text><rect x="560" y="58" width="410" height="152" rx="14" fill="#111e32" stroke="#223047"/><path class="wire" d="M640 100H700" style="animation-delay:0s"/><path class="wire" d="M770 100H820" style="animation-delay:0.4s"/><path class="wire" d="M890 100V140" style="animation-delay:0.8s"/><path class="opt" d="M640 112V160H740"/><g class="lit" style="animation-delay:0s"><rect x="575" y="86" width="66" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="608" y="104.68" fill="#f2f6ff" font-size="12" text-anchor="middle">request</text></g><g class="lit" style="animation-delay:0.8s"><rect x="700" y="86" width="70" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="735" y="104.68" fill="#f2f6ff" font-size="12" text-anchor="middle">SONA</text></g><g class="lit" style="animation-delay:1.6s"><rect x="820" y="86" width="140" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="890" y="104.68" fill="#f2f6ff" font-size="12" text-anchor="middle">TurboQuant KV</text></g><circle cx="890" cy="154" r="16" fill="none" stroke="#5cf2c3" class="pulse"/><g><rect x="830" y="140" width="120" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="890" y="158.68" fill="#f2f6ff" font-size="12" text-anchor="middle">GGUF inference</text></g><g class="lit" style="animation-delay:2.4s"><rect x="740" y="146" width="80" height="28" rx="7" fill="#162238" stroke="#bd9bff"/><text x="780" y="164.68" fill="#f2f6ff" font-size="11" text-anchor="middle">gpu-loop</text></g><text x="765" y="200" fill="#8297b1" font-size="11" text-anchor="middle">route · adapt · compress · generate · optional GPU jobs</text></svg>
