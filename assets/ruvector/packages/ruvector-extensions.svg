<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">ruvector-extensions — Embeddings, persistence, exports, temporal tracking and UI for the ruvector vector database.</title><desc id="desc">Animated RuVector package banner. Extension modules light up and connect to the ruvector core.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / EXTENSIONS</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">ruvector-extensions</text><text x="30" y="126" fill="#abbad0" font-size="16">Embeddings, persistence, exports, temporal tracking and UI for</text><text x="30" y="148" fill="#abbad0" font-size="16">the ruvector vector database.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install ruvector-extensions</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path class="wire" style="animation-delay:0s" d="M650 78L785 128"/><path class="wire" style="animation-delay:0.4s" d="M920 78L785 128"/><path class="wire" style="animation-delay:0.8s" d="M650 176L785 128"/><path class="wire" style="animation-delay:1.2000000000000002s" d="M920 176L785 128"/><path class="wire" style="animation-delay:1.6s" d="M785 196L785 128"/><g class="lit" style="animation-delay:0s"><rect x="602" y="66" width="96" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="650" y="81.96" fill="#f2f6ff" font-size="11" text-anchor="middle">embeddings</text></g><g class="lit" style="animation-delay:1s"><rect x="872" y="66" width="96" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="920" y="81.96" fill="#f2f6ff" font-size="11" text-anchor="middle">persistence</text></g><g class="lit" style="animation-delay:2s"><rect x="602" y="164" width="96" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="650" y="179.96" fill="#f2f6ff" font-size="11" text-anchor="middle">exports</text></g><g class="lit" style="animation-delay:3s"><rect x="872" y="164" width="96" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="920" y="179.96" fill="#f2f6ff" font-size="11" text-anchor="middle">temporal</text></g><g class="lit" style="animation-delay:4s"><rect x="737" y="184" width="96" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="785" y="199.96" fill="#f2f6ff" font-size="11" text-anchor="middle">UI</text></g><g ><rect x="735" y="112" width="100" height="32" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="785" y="132.68" fill="#f2f6ff" font-size="13" text-anchor="middle">ruvector</text></g></svg>
