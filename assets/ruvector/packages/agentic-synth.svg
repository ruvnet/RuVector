<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/agentic-synth — Synthetic data generator for AI/ML training, RAG systems and agentic workflows.</title><desc id="desc">Animated RuVector package banner. A schema flows into generated data rows that appear one by one.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SYNTHETIC DATA</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/agentic-synth</text><text x="30" y="126" fill="#abbad0" font-size="16">Synthetic data generator for AI/ML training, RAG systems and</text><text x="30" y="148" fill="#abbad0" font-size="16">agentic workflows.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/agentic-synth</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g ><rect x="616" y="92" width="100" height="66" rx="7" fill="#162238" stroke="#bd9bff"/><text x="666" y="129.68" fill="#f2f6ff" font-size="13" text-anchor="middle">{ schema }</text></g><path class="wire" d="M716 125H752"/><g class="lit" style="animation-delay:0s"><rect x="760" y="70" width="190" height="16" rx="4" fill="#162238" stroke="#5cf2c3"/><path d="M768 78H800M850 78H880" stroke="#b8c7da" stroke-width="3"/></g><g class="lit" style="animation-delay:0.9s"><rect x="760" y="92" width="190" height="16" rx="4" fill="#162238" stroke="#5cf2c3"/><path d="M768 100H837M850 100H903" stroke="#b8c7da" stroke-width="3"/></g><g class="lit" style="animation-delay:1.8s"><rect x="760" y="114" width="190" height="16" rx="4" fill="#162238" stroke="#5cf2c3"/><path d="M768 122H814M850 122H926" stroke="#b8c7da" stroke-width="3"/></g><g class="lit" style="animation-delay:2.7s"><rect x="760" y="136" width="190" height="16" rx="4" fill="#162238" stroke="#5cf2c3"/><path d="M768 144H851M850 144H899" stroke="#b8c7da" stroke-width="3"/></g><g class="lit" style="animation-delay:3.6s"><rect x="760" y="158" width="190" height="16" rx="4" fill="#162238" stroke="#5cf2c3"/><path d="M768 166H828M850 166H922" stroke="#b8c7da" stroke-width="3"/></g><text x="616" y="200" fill="#8297b1" font-size="11">schema-driven synthetic records for training + RAG</text></svg>
