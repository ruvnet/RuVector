<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/learning-wasm — Ultra-fast MicroLoRA adaptation in WebAssembly.</title><desc id="desc">Animated RuVector package banner. An input vector passes through a rank-2 low-rank adapter to an output; a reward signal pulses back to update the adapter.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5);opacity:1}}@media(prefers-reduced-motion:reduce){.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / MICROLORA / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/learning-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">Ultra-fast MicroLoRA adaptation for WASM -</text><text x="30" y="148" fill="#abbad0" font-size="16">rank-2 LoRA for per-operator learning.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/learning-wasm</text>
<rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="625" y="105" width="60" height="50" rx="8" fill="#1b2a44" stroke="#374354"/><text x="637" y="135" fill="#abbad0" font-size="13">input</text><rect x="720" y="95" width="70" height="70" rx="10" fill="#1b2a44" stroke="#bd9bff" stroke-width="2"/><text x="731" y="125" fill="#f2f6ff" font-size="13">A · B</text><text x="729" y="145" fill="#abbad0" font-size="11">rank 2</text><rect x="825" y="105" width="60" height="50" rx="8" fill="#1b2a44" stroke="#374354"/><text x="835" y="135" fill="#abbad0" font-size="13">output</text><path d="M685 130H720M790 130H825" stroke="#5cf2c3" stroke-width="2" class="lit"/><path d="M855 105C855 75 760 75 755 95" stroke="#bd9bff" stroke-width="2" fill="none" class="lit" style="animation-delay:3s"/><circle cx="755" cy="95" r="5" fill="#bd9bff" class="pulse"/><text x="880" y="90" fill="#bd9bff" font-size="12">reward</text><text x="616" y="200" fill="#8297b1" font-size="12">forward → adapt with reward → forward</text></svg>