<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/agentic-synth-examples — Examples for @ruvector/agentic-synth: market simulation, self-learning, DSPy benchmarking.</title><desc id="desc">Animated RuVector package banner. A simulated price line draws itself while candles appear one by one.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SYNTHETIC DATA EXAMPLES</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/agentic-synth-examples</text><text x="30" y="126" fill="#abbad0" font-size="16">Examples for agentic-synth: market simulation, self-learning</text><text x="30" y="148" fill="#abbad0" font-size="16">generators and DSPy multi-model benchmarking.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/agentic-synth-examples</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path class="wire" d="M620 170L660 150L700 158L740 128L780 136L820 104L860 112L900 84L940 92"/><g class="lit" style="animation-delay:0s"><path d="M660 138V164" stroke="#b8c7da" stroke-width="2"/><rect x="654" y="144" width="12" height="14" rx="2" fill="#5cf2c3"/></g><g class="lit" style="animation-delay:0.9s"><path d="M740 116V142" stroke="#b8c7da" stroke-width="2"/><rect x="734" y="122" width="12" height="14" rx="2" fill="#5cf2c3"/></g><g class="lit" style="animation-delay:1.8s"><path d="M780 124V150" stroke="#b8c7da" stroke-width="2"/><rect x="774" y="130" width="12" height="12" rx="2" fill="#bd9bff"/></g><g class="lit" style="animation-delay:2.7s"><path d="M820 92V118" stroke="#b8c7da" stroke-width="2"/><rect x="814" y="98" width="12" height="14" rx="2" fill="#5cf2c3"/></g><g class="lit" style="animation-delay:3.6s"><path d="M900 72V98" stroke="#b8c7da" stroke-width="2"/><rect x="894" y="78" width="12" height="14" rx="2" fill="#5cf2c3"/></g><text x="616" y="200" fill="#8297b1" font-size="11">simulated OHLCV, self-learning loops, DSPy benchmarks</text></svg>
