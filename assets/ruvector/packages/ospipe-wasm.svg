<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/ospipe-wasm — OSpipe personal AI memory search in the browser — WebAssembly bindings.</title><desc id="desc">Animated RuVector package banner. Frames are embedded in the browser and stored as searchable memory points.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / PERSONAL AI MEMORY / WASM</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/ospipe-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">OSpipe personal AI memory search in the browser — WebAssembly</text><text x="30" y="148" fill="#abbad0" font-size="16">bindings.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/ospipe-wasm</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="618" y="78" width="70" height="48" rx="4" fill="#162238" stroke="#b8c7da" class="lit" style="animation-delay:0s"/><rect x="626" y="86" width="70" height="48" rx="4" fill="#162238" stroke="#b8c7da" class="lit" style="animation-delay:0.6s"/><rect x="634" y="94" width="70" height="48" rx="4" fill="#162238" stroke="#b8c7da" class="lit" style="animation-delay:1.2s"/><path class="wire" d="M710 110H740"/><g class="lit" style="animation-delay:2s"><rect x="744" y="96" width="66" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="777" y="114.32" fill="#f2f6ff" font-size="12" text-anchor="middle">embed</text></g><path class="wire" d="M810 110H838"/><circle cx="852" cy="88" r="5" fill="#5cf2c3" class="lit" style="animation-delay:3s"/><circle cx="874" cy="88" r="5" fill="#5cf2c3" class="lit" style="animation-delay:3.3s"/><circle cx="896" cy="88" r="5" fill="#5cf2c3" class="lit" style="animation-delay:3.5s"/><circle cx="852" cy="110" r="5" fill="#5cf2c3" class="lit" style="animation-delay:3.8s"/><circle cx="874" cy="110" r="5" fill="#ffbe73" class="lit" style="animation-delay:4s"/><circle cx="896" cy="110" r="5" fill="#5cf2c3" class="lit" style="animation-delay:4.3s"/><circle cx="852" cy="132" r="5" fill="#5cf2c3" class="lit" style="animation-delay:4.5s"/><circle cx="874" cy="132" r="5" fill="#5cf2c3" class="lit" style="animation-delay:4.8s"/><circle cx="896" cy="132" r="5" fill="#5cf2c3" class="lit" style="animation-delay:5s"/><text x="616" y="196" fill="#8297b1" font-size="11">in-browser embed · dedupe · search</text></svg>
