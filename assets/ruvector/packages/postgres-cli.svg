<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/postgres-cli — Vector database CLI for PostgreSQL — a pgvector drop-in with SQL functions, GNN layers and attention.</title><desc id="desc">Animated RuVector package banner. A terminal types a vector similarity query that flows into PostgreSQL.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / POSTGRESQL</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/postgres-cli</text><text x="30" y="126" fill="#abbad0" font-size="16">Vector database CLI for PostgreSQL — a pgvector drop-in with SQL</text><text x="30" y="148" fill="#abbad0" font-size="16">functions, GNN layers and attention.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/postgres-cli</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="612" y="74" width="230" height="104" rx="8" fill="#08101e" stroke="#374354"/><g class="lit" style="animation-delay:0s"><text x="624" y="98" fill="#5cf2c3" font-size="12">$ ruvector-pg search</text></g><g class="lit" style="animation-delay:0.8s"><text x="624" y="120" fill="#f2f6ff" font-size="12">SELECT id FROM docs</text></g><g class="lit" style="animation-delay:1.6s"><text x="624" y="142" fill="#f2f6ff" font-size="12">ORDER BY v &lt;=&gt; $1</text></g><g class="lit" style="animation-delay:2.4s"><text x="624" y="164" fill="#f2f6ff" font-size="12">LIMIT 5;</text></g><path class="wire" d="M846 126H870"/><g fill="#162238" stroke="#bd9bff"><path d="M876 104v40a38 7 0 0 0 76 0v-40"/><ellipse cx="914" cy="104" rx="38" ry="7"/></g><text x="914" y="132" fill="#f2f6ff" font-size="12" text-anchor="middle">Postgres</text><text x="612" y="202" fill="#8297b1" font-size="11">pgvector-compatible SQL from the terminal</text></svg>
