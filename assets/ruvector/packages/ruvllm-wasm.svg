<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/ruvllm-wasm — RuvLLM runtime pieces in WebAssembly — KV cache, chat templates, HNSW routing and MicroLoRA.</title><desc id="desc">Animated RuVector package banner. Tokens pass through a chat template and fill a two-tier KV cache.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / RUVLLM / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/ruvllm-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">RuvLLM runtime pieces in WebAssembly — KV cache, chat templates,</text><text x="30" y="148" fill="#abbad0" font-size="16">HNSW routing and MicroLoRA.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/ruvllm-wasm</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0s"><rect x="612" y="72" width="62" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="643" y="87.6" fill="#f2f6ff" font-size="10" text-anchor="middle">&lt;|user|&gt;</text></g><g class="lit" style="animation-delay:0.6s"><rect x="680" y="72" width="62" height="24" rx="7" fill="#162238" stroke="#bd9bff"/><text x="711" y="87.6" fill="#f2f6ff" font-size="10" text-anchor="middle">hello</text></g><path class="wire" d="M680 100V114"/><g ><rect x="624" y="116" width="112" height="28" rx="7" fill="#162238" s