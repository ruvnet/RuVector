<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">ruvbot — Self-learning AI assistant with vector memory, security controls and multi-model LLM support.</title><desc id="desc">Animated RuVector package banner. Chat messages appear in turn while recalled context flows from a memory store.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / AI ASSISTANT</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">ruvbot</text><text x="30" y="126" fill="#abbad0" font-size="16">Self-learning AI assistant with vector memory, security controls</text><text x="30" y="148" fill="#abbad0" font-size="16">and multi-model LLM support.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install ruvbot</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0s"><rect x="616" y="70" width="160" height="26" rx="7" fill="#162238" stroke="#bd9bff"/><text x="696" y="86.96" fill="#f2f6ff" font-size="11" text-anchor="middle">How do I deploy?</text></g><g class="lit" style="animation-delay:1.5s"><rect x="700" y="104" width="160" height="26" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="780" y="120.96" fill="#f2f6ff" font-size="11" text-anchor="middle">Recalled 3 memories…</text></g><g class="lit" style="animation-delay:3s"><rect x="616" y="138" width="130" height="26" rx="7" fill="#162238" stroke="#bd9bff"/><text x="681" y="154.96" fill="#f2f6ff" font-size="11" text-anchor="middle">Thanks!</text></g><path class="wire" d="M864 117H886"/><g fill="#162238" stroke="#ffbe73"><path d="M890 100v36a32 7 0 0 0 64 0v-36"/><ellipse cx="922" cy="100" rx="32" ry="7"/></g><text x="922" y="126" fill="#f2f6ff" font-size="12" text-anchor="middle">memory</text><text x="616" y="200" fill="#8297b1" font-size="11">self-learning assistant · vector memory · multi-LLM</text></svg>
