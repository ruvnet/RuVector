<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/acorn-wasm — ACORN predicate-agnostic filtered HNSW in WebAssembly — high-recall search with metadata filters.</title><desc id="desc">Animated RuVector package banner. A search path hops only across graph nodes that match a metadata filter.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / FILTERED SEARCH / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/acorn-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">ACORN predicate-agnostic filtered HNSW in WebAssembly —</text><text x="30" y="148" fill="#abbad0" font-size="16">high-recall search with metadata filters.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/acorn-wasm</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><circle cx="640" cy="82" r="6" fill="#5cf2c3" /><circle cx="715" cy="82" r="6" fill="#374354" /><circle cx="790" cy="82" r="6" fill="#5cf2c3" /><circle cx="865" cy="82" r="6" fill="#374354" /><circle cx="940" cy="82" r="6" fill="#374354" /><circle cx="640" cy="124" r="6" fill="#374354" /><circle cx="715" cy="124" r="6" fill="#5cf2c3" /><circle cx="790" cy="124" r="6" fill="#374354" /><circle cx="865" cy="124" r="6" fill="#5cf2c3" /><circle cx="940" cy="124" r="6" fill="#5cf2c3" /><circle cx="640" cy="166" r="6" fill="#374354" /><circle cx="715" cy="166" r="6" fill="#374354" /><circle cx="790" cy="166" r="6" fill="#5cf2c3" /><circle cx="865" cy="166" r="6" fill="#374354" /><circle cx="940" cy="166" r="6" fill="#5cf2c3" /><path class="wire" d="M640 82L715 124L790 166L865 124L940 124L940 166"/><circle cx="640" cy="82" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:0s"/><circle cx="715" cy="124" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:0.8s"/><circle cx="790" cy="166" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:1.6s"/><circle cx="865" cy="124" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:2.4s"/><circle cx="940" cy="124" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:3.2s"/><circle cx="940" cy="166" r="10" fill="none" stroke="#ffbe73" class="lit" style="animation-delay:4s"/><text x="616" y="200" fill="#8297b1" font-size="11">filter: lang = rust — search stays on matching nodes</text></svg>
