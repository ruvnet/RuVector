<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/rabitq-wasm — RaBitQ 1-bit quantized vector index in WebAssembly — 32× compression with high-recall rerank.</title><desc id="desc">Animated RuVector package banner. Float coordinate bars collapse while matching 1-bit codes appear.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.col{transform-box:fill-box;transform-origin:50% 100%;animation:col 6s ease-in-out infinite}.bit{animation:bit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes col{0%,35%{transform:none}50%,90%{transform:scaleY(.12)}}@keyframes bit{0%,40%{opacity:.15}55%,90%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.col,.bit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / QUANTIZATION / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/rabitq-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">RaBitQ 1-bit quantized vector index in WebAssembly — 32×</text><text x="30" y="148" fill="#abbad0" font-size="16">compression with high-recall rerank.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/rabitq-wasm</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="620" y="100" width="12" height="60" rx="2" fill="#5cf2c3" class="col" style="animation-delay:0s"/><rect x="638" y="132" width="12" height="28" rx="2" fill="#bd9bff" class="col" style="animation-delay:0.1s"/><rect x="656" y="88" width="12" height="72" rx="2" fill="#5cf2c3" class="col" style="animation-delay:0.2s"/><rect x="674" y="116" width="12" height="44" rx="2" fill