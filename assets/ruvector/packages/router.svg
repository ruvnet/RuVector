<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/router — Semantic router for AI agents — vector-based intent matching with HNSW indexing and SIMD.</title><desc id="desc">Animated RuVector package banner. An intent is matched against routes, each lighting up in turn.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@media(prefers-reduced-motion:reduce){.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SEMANTIC ROUTER</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/router</text><text x="30" y="126" fill="#abbad0" font-size="16">Semantic router for AI agents — vector-based intent matching</text><text x="30" y="148" fill="#abbad0" font-size="16">with HNSW indexing and SIMD.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/router</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M700 128L840 80" stroke="#374354" /><path d="M700 128L840 112" stroke="#374354" /><path d="M700 128L840 144" stroke="#374354" /><path d="M700 128L840 176" stroke="#374354" /><path d="M700 128L840 80" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:0s"/><path d="M700 128L840 112" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:1.5s"/><path d="M700 128L840 144" stroke="#5cf2c3" stroke-width="2" class="lit" style="animation-delay:3s"/><path d="M700 128L840 176" stroke="#5cf2c3" stroke-width="