<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">ruvector — Vector search and persistent agent memory for Node.js — HNSW, ONNX embeddings, GNN and attention.</title><desc id="desc">Animated RuVector package banner. A query point pulses while its nearest neighbours light up one by one.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@media(prefers-reduced-motion:reduce){.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / VECTOR DATABASE</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">ruvector</text><text x="30" y="126" fill="#abbad0" font-size="16">Vector search and persistent agent memory for Node.js — HNSW,</text><text x="30" y="148" fill="#abbad0" font-size="16">ONNX embeddings, GNN and attention.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install ruvector</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><circle cx="640" cy="90" r="3.5" fill="#8297b1" /><circle cx="672" cy="150" r="3.5" fill="#8297b1" /><circle cx="700" cy="78" r="3.5" fill="#8297b1" /><circle cx="720" cy="180" r="3.5" fill="#8297b1" /><circle cx="745" cy="110" r="3.5" fill="#8297b1" /><circle cx="770" cy="160" r="3.5" fill="#8297b1" /><circle cx="800" cy="85" r="3.5" fill="#8297b1" /><circle cx="812" cy="128" r="3.5" fill="#8297b1" /><circle cx="790" cy="140" r="3.5" fill="#8297b1" /><circle cx="835" cy="175" r="3.5" fill="#8297b1" /><circle cx="860" cy="100" r="3.5" fill="#8297b1" /><circle cx="885" cy="150" r="3.5" fill="#8297b1" /><circle cx="910" cy="80" r="3.5" fill="#8297b1" /><circle cx="930" cy="175" r="3.5" fill="#8297b1" /><circle cx="760" cy="128" r="3.5" fill="#8297b1" /><circle cx="828" cy="105" r="3.5" fill="#8297b1" /><path d="M795 125L812 128" stroke="#5cf2c3" stroke-width="1.5" class="lit" style="animation-delay:0s"/><circle cx="812" cy="128" r="5" fill="#5cf2c3" class="lit" style="animation-delay:0s"/><path d="M795 125L790 140" stroke="#5cf2c3" stroke-width="1.5" class="lit" style="animation-delay:0.5s"/><circle cx="790" cy="140" r="5" fill="#5cf2c3" class="lit" style="animation-delay:0.5s"/><path d="M795 125L760 128" stroke="#5cf2c3" stroke-width="1.5" class="lit" style="animation-delay:1s"/><circle cx="760" cy="128" r="5" fill="#5cf2c3" class="lit" style="animation-delay:1s"/><path d="M795 125L828 105" stroke="#5cf2c3" stroke-width="1.5" class="lit" style="animation-delay:1.5s"/><circle cx="828" cy="105" r="5" fill="#5cf2c3" class="lit" style="animation-delay:1.5s"/><path d="M795 125L770 160" stroke="#5cf2c3" stroke-width="1.5" class="lit" style="animation-delay:2s"/><circle cx="770" cy="160" r="5" fill="#5cf2c3" class="lit" style="animation-delay:2s"/><circle cx="795" cy="125" r="12" fill="none" stroke="#ffbe73" class="pulse"/><circle cx="795" cy="125" r="5" fill="#ffbe73" /><text x="616" y="200" fill="#8297b1" font-size="12">query → top-k neighbours + memory</text></svg>
