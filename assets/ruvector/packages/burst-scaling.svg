<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/burst-scaling — Adaptive burst scaling for ruvector — handles 10–50× traffic spikes.</title><desc id="desc">Animated RuVector package banner. A traffic spike grows while the capacity line steps up to follow it.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.wire,.grow{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / AUTO-SCALING</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/burst-scaling</text><text x="30" y="126" fill="#abbad0" font-size="16">Adaptive burst scaling for ruvector — handles 10–50× traffic</text><text x="30" y="148" fill="#abbad0" font-size="16">spikes.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/burst-scaling</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="625" y="160" width="22" height="20" rx="3" fill="#bd9bff" /><rect x="657" y="158" width="22" height="22" rx="3" fill="#bd9bff" /><rect x="689" y="155" width="22" height="25" rx="3" fill="#bd9bff" /><rect x="721" y="156" width="22" height="24" rx="3" fill="#bd9bff" /><rect x="753" y="110" width="22" height="70" rx="3" fill="#ffbe73" class="grow" style="animation-delay:0s"/><rect x="785" y="84" width="22" height="96" rx="3" fill="#ffbe73" class="grow" style="animation-delay:0s"/><rect x="817" y="92" width="22" height="88" rx="3" fill="#ffbe73" class="grow" style="animation-delay:0s"/><rect x="849" y="150" width="22" height="30" rx="3" fill="#bd9bff" /><rect x="881" y="154" width="22" height="26" rx="3" fill="#bd9bff" /><rect x="913" y="158" width="22" height="22" rx="3" fill="#bd9bff" /><path class="wire" d="M620 150H740V78H850V150H950"/><text x="616" y="200" fill="#8297b1" font-size="11">10–50× spike → predictive + reactive scale-out</text></svg>
