<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/rvf-solver — Self-learning temporal solver — Thompson Sampling, PolicyKernel and ReasoningBank.</title><desc id="desc">Animated RuVector package banner. Four policy arms rise and fall as Thompson sampling picks the best one.</desc><style>text{font-family:Arial,sans-serif}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.pulse,.grow{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / RVF / SELF-LEARNING SOLVER</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/rvf-solver</text><text x="30" y="126" fill="#abbad0" font-size="16">Self-learning temporal solver — Thompson Sampling, PolicyKernel</text><text x="30" y="148" fill="#abbad0" font-size="16">and ReasoningBank.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/rvf-solver</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="640" y="76" width="40" height="84" rx="5" fill="#bd9bff" class="grow" style="animation-delay:0s"/><text x="660" y="176" fill="#b8c7da" font-size="11" text-anchor="middle">policy A</text><rect x="722" y="76" width="40" height="84" rx="5" fill="#bd9bff" class="grow" style="animation-delay:0.9s"/><text x="742" y="176" fill="#b8c7da" font-size="11" text-anchor="middle">policy B</text><rect x="804" y="76" width="40" height="84" rx="5" fill="#5cf2c3" class="grow" style="animation-delay:1.8s"/><text x="824" y="176" fill="#b8c7da" font-size="11" text-anchor="middle">policy C</text><rect x="886" y="76" width="40" height="84" rx="5" fill="#bd9bff" class="grow" style="animation-delay:2.7s"/><text x="906" y="176" fill="#b8c7da" font-size="11" text-anchor="middle">policy D</text><circle cx="824" cy="68" r="5" fill="none" stroke="#ffbe73" class="pulse"/><text x="616" y="202" fill="#8297b1" font-size="11">sample arms → pick → update posterior</text></svg>
