<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/graph-wasm — Neo4j-compatible hypergraph database in WebAssembly — Cypher queries, SIMD, knowledge graphs.</title><desc id="desc">Animated RuVector package banner. Graph nodes and edges light up as a Cypher pattern is matched.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / GRAPH DATABASE / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/graph-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">Neo4j-compatible hypergraph database in WebAssembly — Cypher</text><text x="30" y="148" fill="#abbad0" font-size="16">queries, SIMD, knowledge graphs.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/graph-wasm</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M640 100L745 80" stroke="#374354" /><path d="M640 100L700 160" stroke="#374354" /><path d="M700 160L800 135" stroke="#374354" /><path d="M745 80L800 135" stroke="#374354" /><path d="M745 80L860 75" stroke="#374354" /><path d="M800 135L880 170" stroke="#374354" /><path d="M860 75L935 120" stroke="#374354" /><path d="M880 170L935 120" stroke="#374354" /><path d="M800 135L860 75" stroke="#374354" /><path d="M640 100L745 80" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:0s"/><path d="M640 100L700 160" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:0.5s"/><path d="M700 160L800 135" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:1s"/><path d="M745 80L800 135" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:1.5s"/><path d="M745 80L860 75" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:2s"/><path d="M800 135L880 170" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:2.5s"/><path d="M860 75L935 120" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:3s"/><path d="M880 170L935 120" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:3.5s"/><path d="M800 135L860 75" stroke="#bd9bff" stroke-width="2" class="lit" style="animation-delay:4s"/><circle cx="640" cy="100" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0s"/><circle cx="700" cy="160" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0.5s"/><circle cx="745" cy="80" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1s"/><circle cx="800" cy="135" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1.5s"/><circle cx="860" cy="75" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2s"/><circle cx="880" cy="170" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2.5s"/><circle cx="935" cy="120" r="6" fill="#5cf2c3" class="lit" style="animation-delay:3s"/><text x="616" y="200" fill="#8297b1" font-size="12">MATCH (a)-[r]-&gt;(b) RETURN b</text></svg>
