<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/core — High-performance vector database core with HNSW indexing, built in Rust for similarity search.</title><desc id="desc">Animated RuVector package banner. A search descends greedily through the layers of an HNSW graph.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / VECTOR ENGINE</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/core</text><text x="30" y="126" fill="#abbad0" font-size="16">High-performance vector database core with HNSW indexing, built</text><text x="30" y="148" fill="#abbad0" font-size="16">in Rust for similarity search.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/core</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M615 78H955" stroke="#374354" stroke-dasharray="2 4"/><text x="958" y="82" fill="#8297b1" font-size="10">L2</text><path d="M615 118H955" stroke="#374354" stroke-dasharray="2 4"/><text x="958" y="122" fill="#8297b1" font-size="10">L1</text><path d="M615 160H955" stroke="#374354" stroke-dasharray="2 4"/><text x="958" y="164" fill="#8297b1" font-size="10">L0</text><circle cx="700" cy="78" r="4" fill="#8297b1" /><circle cx="880" cy="78" r="4" fill="#8297b1" /><circle cx="650" cy="118" r="4" fill="#8297b1" /><circle cx="740" cy="118" r="4" fill="#8297b1" /><circle cx="820" cy="118" r="4" fill="#8297b1" /><circle cx="920" cy="118" r="4" fill="#8297b1" /><circle cx="630" cy="160" r="4" fill="#8297b1" /><circle cx="680" cy="160" r="4" fill="#8297b1" /><circle cx="730" cy="160" r="4" fill="#8297b1" /><circle cx="780" cy="160" r="4" fill="#8297b1" /><circle cx="830" cy="160" r="4" fill="#8297b1" /><circle cx="880" cy="160" r="4" fill="#8297b1" /><circle cx="935" cy="160" r="4" fill="#8297b1" /><path class="wire" d="M700 78L880 78L820 118L780 118L780 160L830 160"/><circle cx="700" cy="78" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0s"/><circle cx="880" cy="78" r="6" fill="#5cf2c3" class="lit" style="animation-delay:0.7s"/><circle cx="820" cy="118" r="6" fill="#5cf2c3" class="lit" style="animation-delay:1.4s"/><circle cx="780" cy="118" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2.1s"/><circle cx="780" cy="160" r="6" fill="#5cf2c3" class="lit" style="animation-delay:2.8s"/><circle cx="830" cy="160" r="6" fill="#5cf2c3" class="lit" style="animation-delay:3.5s"/><text x="616" y="200" fill="#8297b1" font-size="12">greedy descent through HNSW layers</text></svg>
