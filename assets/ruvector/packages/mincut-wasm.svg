<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/mincut-wasm — Weighted dynamic minimum cut in WebAssembly.</title><desc id="desc">Animated RuVector package banner. A weighted graph of two clusters; the lightest edges joining them are highlighted as the minimum cut.</desc><style>text{font-family:Arial,sans-serif}.lit{animation:lit 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5);opacity:1}}@media(prefers-reduced-motion:reduce){.lit,.pulse{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / MIN CUT / WEBASSEMBLY</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/mincut-wasm</text><text x="30" y="126" fill="#abbad0" font-size="16">Weighted dynamic minimum cut with validated</text><text x="30" y="148" fill="#abbad0" font-size="16">typed-array batches, in WebAssembly.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/mincut-wasm</text>
<rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><path d="M640 100L690 80M690 80L700 140M700 140L640 100M690 80L740 110M700 140L740 110" stroke="#374354" stroke-width="2"/><path d="M840 90L890 80M890 80L930 130M930 130L860 150M860 150L840 90M890 80L860 150" stroke="#374354" stroke-width="2"/><path d="M740 110L840 90" stroke="#ff7a90" stroke-width="3" class="lit"/><path d="M740 110L860 150" stroke="#ff7a90" stroke-width="3" class="lit" style="animation-delay:1s"/><circle cx="640" cy="100" r="6" fill="#5cf2c3"/><circle cx="690" cy="80" r="6" fill="#5cf2c3"/><circle cx="700" cy="140" r="6" fill="#5cf2c3"/><circle cx="740" cy="110" r="6" fill="#5cf2c3"/><circle cx="840" cy="90" r="6" fill="#5cf2c3"/><circle cx="890" cy="80" r="6" fill="#5cf2c3"/><circle cx="930" cy="130" r="6" fill="#5cf2c3"/><circle cx="860" cy="150" r="6" fill="#5cf2c3"/><text x="616" y="200" fill="#8297b1" font-size="12">edges in → lightest cut → update, no rebuild</text></svg>