<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">ruvector-pq-search — Product quantization with asymmetric distance computation</title><desc id="desc">Animated RuVector crate banner. A vector splits into sub-vectors that light up one by one as each becomes a one-byte code.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / CRATE / PRODUCT QUANTIZATION</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">ruvector-pq-search</text><text x="30" y="126" fill="#abbad0" font-size="16">Flat, IVF and residual PQ indexes with ADC search.</text><text x="30" y="148" fill="#abbad0" font-size="16">Lloyd or e-means codebook training; u8 codes per sub-space.</text><text x="30" y="200" fill="#8297b1" font-size="14">cargo add ruvector-pq-search</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0.0s"><rect x="620" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M638 108V140"/><rect x="626" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:0.6s"><rect x="662" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M680 108V140"/><rect x="668" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:1.2s"><rect x="704" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M722 108V140"/><rect x="710" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:1.8s"><rect x="746" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M764 108V140"/><rect x="752" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:2.4s"><rect x="788" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M806 108V140"/><rect x="794" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:3.0s"><rect x="830" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M848 108V140"/><rect x="836" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:3.6s"><rect x="872" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M890 108V140"/><rect x="878" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><g class="lit" style="animation-delay:4.2s"><rect x="914" y="80" width="36" height="26" rx="4" fill="#1d3a5c" stroke="#5cf2c3"/><path class="wire" d="M932 108V140"/><rect x="920" y="142" width="24" height="22" rx="3" fill="#bd9bff"/></g><text x="620" y="74" fill="#8297b1" font-size="11">f32 sub-vectors</text><text x="620" y="185" fill="#8297b1" font-size="11">u8 codes, scanned with ADC distance tables</text></svg>
