<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">rvlite — Lightweight vector database with SQL, SPARQL and Cypher — runs in Node.js, the browser and at the edge.</title><desc id="desc">Animated RuVector package banner. SQL, Cypher and SPARQL lanes light up and flow into one rvlite store.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / EMBEDDED VECTOR DATABASE</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">rvlite</text><text x="30" y="126" fill="#abbad0" font-size="16">Lightweight vector database with SQL, SPARQL and Cypher — runs</text><text x="30" y="148" fill="#abbad0" font-size="16">in Node.js, the browser and at the edge.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install rvlite</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0s"><rect x="616" y="70" width="96" height="28" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="664" y="88.68" fill="#f2f6ff" font-size="13" text-anchor="middle">SQL</text></g><g class="lit" style="animation-delay:1.6s"><rect x="616" y="110" width="96" height="28" rx="7" fill="#162238" stroke="#bd9bff"/><text x="664" y="128.68" fill="#f2f6ff" font-size="13" text-anchor="middle">Cypher</text></g><g class="lit" style="animation-delay:3.2s"><rect x="616" y="150" width="96" height="28" rx="7" fill="#162238" stroke="#ffbe73"/><text x="664" y="168.68" fill="#f2f6ff" font-size="13" text-anchor="middle">SPARQL</text></g><path class="wire" d="M712 84C780 84 780 124 840 124"/><path class="wire" d="M712 124C780 124 780 124 840 124"/><path class="wire" d="M712 164C780 164 780 124 840 124"/><g fill="#162238" stroke="#5cf2c3"><path d="M845 100v40a50 7 0 0 0 100 0v-40"/><ellipse cx="895" cy="100" rx="50" ry="7"/></g><text x="895" y="128" fill="#f2f6ff" font-size="12" text-anchor="middle">rvlite</text><text x="616" y="202" fill="#8297b1" font-size="11">one store · three query languages</text></svg>
