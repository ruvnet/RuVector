<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/rvf — Unified TypeScript SDK for the RuVector Format (RVF) cognitive container.</title><desc id="desc">Animated RuVector package banner. Segments of an RVF cognitive container light up in turn as data flows over it.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / RVF / TYPESCRIPT SDK</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/rvf</text><text x="30" y="126" fill="#abbad0" font-size="16">Unified TypeScript SDK for the RuVector Format (RVF) cognitive</text><text x="30" y="148" fill="#abbad0" font-size="16">container.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/rvf</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="620" y="104" width="330" height="48" rx="10" fill="none" stroke="#bd9bff"/><g class="lit" style="animation-delay:0s"><rect x="624" y="108" width="58" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="653" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">VEC</text></g><g class="lit" style="animation-delay:0.9s"><rect x="690" y="108" width="58" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="719" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">INDEX</text></g><g class="lit" style="animation-delay:1.8s"><rect x="756" y="108" width="58" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="785" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">MODEL</text></g><g class="lit" style="animation-delay:2.7s"><rect x="822" y="108" width="58" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="851" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">KERNEL</text></g><g class="lit" style="animation-delay:3.6s"><rect x="888" y="108" width="58" height="40" rx="6" fill="#162238" stroke="#5cf2c3"/><text x="917" y="133" fill="#f2f6ff" font-size="11" text-anchor="middle">WITNESS</text></g><path class="wire" d="M640 80H930"/><text x="620" y="74" fill="#8297b1" font-size="11">ingest · query · derive</text><text x="616" y="182" fill="#8297b1" font-size="12">one cognitive container · Node (N-API) or WASM backend</text></svg>
