<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/rvf-mcp-server — MCP server for RuVector Format vector stores — stdio and SSE transports for AI agents.</title><desc id="desc">Animated RuVector package banner. MCP clients connect through the server to an RVF store.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.lit{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / MODEL CONTEXT PROTOCOL</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/rvf-mcp-server</text><text x="30" y="126" fill="#abbad0" font-size="16">MCP server for RuVector Format vector stores — stdio and SSE</text><text x="30" y="148" fill="#abbad0" font-size="16">transports for AI agents.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/rvf-mcp-server</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><g class="lit" style="animation-delay:0s"><rect x="612" y="80" width="104" height="26" rx="7" fill="#162238" stroke="#bd9bff"/><text x="664" y="96.96" fill="#f2f6ff" font-size="11" text-anchor="middle">Claude Code</text></g><g class="lit" style="animation-delay:1.2s"><rect x="612" y="118" width="104" height="26" rx="7" fill="#162238" stroke="#bd9bff"/><text x="664" y="134.96" fill="#f2f6ff" font-size="11" text-anchor="middle">Cursor</text></g><g class="lit" style="animation-delay:2.4s"><rect x="612" y="156" width="104" height="26" rx="7" fill="#162238" stroke="#bd9bff"/><text x="664" y="172.96" fill="#f2f6ff" font-size="11" text-anchor="middle">any MCP client</text></g><path class="wire" style="animation-delay:0s" d="M716 93C745 93 745 132 770 132"/><path class="wire" style="animation-delay:0.4s" d="M716 131C745 131 745 132 770 132"/><path class="wire" style="animation-delay:0.8s" d="M716 169C745 169 745 132 770 132"/><g ><rect x="770" y="110" width="96" height="44" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="818" y="136.32" fill="#f2f6ff" font-size="12" text-anchor="middle">MCP server</text></g><path class="wire" d="M866 132H884"/><g fill="#162238" stroke="#ffbe73"><path d="M888 114v30a33 7 0 0 0 66 0v-30"/><ellipse cx="921" cy="114" rx="33" ry="7"/></g><text x="921" y="137" fill="#f2f6ff" font-size="12" text-anchor="middle">RVF</text><text x="818" y="176" fill="#8297b1" font-size="11" text-anchor="middle">stdio · SSE</text></svg>
