<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">@ruvector/scipix — OCR client for scientific documents — extract LaTeX and MathML from equations and papers.</title><desc id="desc">Animated RuVector package banner. A scan line sweeps a page and LaTeX and MathML outputs light up.</desc><style>text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#5cf2c3;stroke-width:2;stroke-dasharray:8 7;animation:flow 3s linear infinite}.lit{animation:lit 6s ease-in-out infinite}.scan{animation:scan 3s ease-in-out infinite alternate}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes lit{0%,100%{opacity:.3}12%,40%{opacity:1}}@keyframes scan{to{transform:translateY(84px)}}@media(prefers-reduced-motion:reduce){.wire,.lit,.scan{animation:none}}</style><rect width="1000" height="240" rx="18" fill="#0c1324"/><path d="M0 42H1000M0 226H1000" stroke="#223047"/><text x="30" y="29" fill="#5cf2c3" font-size="13" letter-spacing="3">RUVECTOR / NPM / SCIENTIFIC OCR</text><text x="30" y="92" fill="#f2f6ff" font-size="29" font-weight="bold">@ruvector/scipix</text><text x="30" y="126" fill="#abbad0" font-size="16">OCR client for scientific documents — extract LaTeX and MathML</text><text x="30" y="148" fill="#abbad0" font-size="16">from equations and papers.</text><text x="30" y="200" fill="#8297b1" font-size="14">npm install @ruvector/scipix</text><rect x="600" y="58" width="370" height="152" rx="14" fill="#111e32" stroke="#223047"/><rect x="625" y="66" width="120" height="120" rx="6" fill="#162238" stroke="#b8c7da"/><path d="M640 84H730" stroke="#374354" stroke-width="3"/><path d="M640 100H730" stroke="#374354" stroke-width="3"/><path d="M640 132H690" stroke="#374354" stroke-width="3"/><path d="M640 148H730" stroke="#374354" stroke-width="3"/><path d="M640 164H730" stroke="#374354" stroke-width="3"/><text x="712" y="136" fill="#f2f6ff" font-size="12" text-anchor="middle">a/b</text><path class="scan" d="M628 74H742" stroke="#5cf2c3" stroke-width="2"/><path class="wire" d="M755 126H790"/><g class="lit" style="animation-delay:0s"><rect x="800" y="84" width="150" height="30" rx="7" fill="#162238" stroke="#5cf2c3"/><text x="875" y="103.68" fill="#f2f6ff" font-size="13" text-anchor="middle">\frac{a}{b}</text></g><g class="lit" style="animation-delay:2s"><rect x="800" y="132" width="150" height="30" rx="7" fill="#162238" stroke="#bd9bff"/><text x="875" y="151.32" fill="#f2f6ff" font-size="12" text-anchor="middle">&lt;mfrac&gt;…&lt;/mfrac&gt;</text></g><text x="616" y="202" fill="#8297b1" font-size="11">equations → LaTeX + MathML</text></svg>
