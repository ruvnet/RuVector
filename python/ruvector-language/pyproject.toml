[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvector-language"
version = "0.1.0"
description = "Python client for RuGraph graph programs and evidence decisions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["ruvector_language*"]
