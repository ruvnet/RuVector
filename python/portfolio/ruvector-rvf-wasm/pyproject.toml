[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ruvector-rvf-wasm"
version = "0.2.0"
description = "Sandboxed RVF vector queries using the real RuVector WebAssembly microkernel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RuVector Team"}]
dependencies = ["ruvector==0.1.4", "wasmtime==49.0.0"]
keywords = ["ruvector", "rust", "graph", "embeddings", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ruvnet/RuVector"
Documentation = "https://github.com/ruvnet/RuVector/tree/main/python/portfolio/ruvector-rvf-wasm"
Repository = "https://github.com/ruvnet/RuVector"
Issues = "https://github.com/ruvnet/RuVector/issues"
Changelog = "https://github.com/ruvnet/RuVector/blob/main/python/portfolio/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ruvector_rvf_wasm"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
