[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ruvector-ruvllm"
version = "0.2.1"
description = "Bounded native Rust key value cache and attention primitives for Python LLM pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RuVector Team"}]
dependencies = ["ruvector==0.1.5", "numpy>=1.21"]
keywords = ["ruvector", "rust", "llm", "kv-cache", "attention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ruvnet/RuVector"
Documentation = "https://github.com/ruvnet/RuVector/tree/main/python/portfolio/ruvector-ruvllm"
Repository = "https://github.com/ruvnet/RuVector"
Issues = "https://github.com/ruvnet/RuVector/issues"
Changelog = "https://github.com/ruvnet/RuVector/blob/main/python/portfolio/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ruvector_ruvllm"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
