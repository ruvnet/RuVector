[package]
name = "sevensense-core"
description = "Core types and traits for 7sense bioacoustic analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bioacoustics", "audio-analysis", "ddd", "domain-driven-design"]
categories = ["science", "multimedia::audio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# uuid's v4 generator needs a randomness source named explicitly on
# wasm32-unknown-unknown, where there is no OS entropy API. Without this the
# crate fails to compile for the browser target that ADR-010 depends on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
