[package]
name = "sevensense-vector"
description = "Vector database operations and HNSW indexing for 7sense bioacoustics platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["hnsw", "vector-search", "embeddings", "similarity", "bioacoustics"]
categories = ["science", "algorithms", "database"]

[dependencies]
# Internal crates
sevensense-core = { workspace = true, version = "0.1.0", optional = true }
# Async runtime
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Tracing
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { version = "1.3", optional = true }
# Vector database (optional external backend)
qdrant-client = { workspace = true, optional = true }
# HNSW implementation (local backend)
instant-distance = { version = "0.6", optional = true }
# Concurrency
parking_lot = { version = "0.12", optional = true }
rayon = { version = "1.10", optional = true }
# Numerical computing
ndarray = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
hashbrown = { version = "0.14", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
proptest = { workspace = true }
criterion = { workspace = true }
rand = "0.8"
approx = "0.5"
tempfile = "3.10"

[[bench]]
name = "hnsw_benchmark"
harness = false

# uuid's v4 generator needs an explicit randomness source on
# wasm32-unknown-unknown, which has no OS entropy API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[features]
default = ["native"]

# The native pipeline: HNSW indexing, persistence, and async services.
# Disabling it leaves distance, hyperbolic, and projection -- pure computation
# that builds for wasm32-unknown-unknown. See ADR-012.
native = [
    "local-hnsw",
    "dep:sevensense-core",
    "dep:tokio",
    "dep:async-trait",
    "dep:futures",
    "dep:anyhow",
    "dep:parking_lot",
    "dep:rayon",
    "dep:instant-distance",
    "dep:bincode",
]

local-hnsw = ["dep:instant-distance"]
qdrant-backend = ["dep:qdrant-client"]
hyperbolic = []
simd = []

# Everything, including the optional external vector-database backend.
full = ["native", "qdrant-backend", "hyperbolic", "simd"]
