name: Clippy + fmt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      # Pinned, not floating `stable`: rustc 1.99.0's clippy::double_must_use
      # fires on #[async_trait] fns in rvagent-core (graph.rs, models.rs) and
      # broke this job on a PR that touches none of that code. Bump together
      # with a fix for those lints.
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
