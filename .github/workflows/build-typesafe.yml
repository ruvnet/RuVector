name: Build Typesafe Native Modules

# Builds and publishes the five platform binaries for @ruvector/typesafe plus
# the meta package. Modelled on build-router.yml with native-architecture
# runners for every platform, so each ONNX binary is loaded before publishing.
#
# Two deliberate deviations from build-router.yml, both called out in the PR:
#   1. Publish is gated ONLY on a manual workflow_dispatch with `publish: true`
#      (router also auto-publishes on a `v*` tag). @ruvector/typesafe ships from
#      an explicit human dispatch, never as a side effect of tagging the repo.
#   2. Publishing fails loudly and is verified on the registry (see below).
#      An existing version cannot substitute older hash-only binary bytes.
#
# Release binaries are built with native-onnx on every target. Manual publish
# depends on a strict frozen ONNX ticket run against the linux-x64-gnu artifact
# from this SAME build matrix. The model and tokenizer are hash-pinned, and
# model bytes are downloaded only for the release check, never at runtime.

on:
  push:
    branches: [main]
    paths:
      - 'crates/ruvector-typesafe-core/**'
      - 'crates/ruvector-typesafe-ffi/**'
      - 'npm/packages/typesafe/**'
      - '.github/workflows/build-typesafe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ruvector-typesafe-core/**'
      - 'crates/ruvector-typesafe-ffi/**'
      - 'npm/packages/typesafe/**'
      - '.github/workflows/build-typesafe.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the platform + meta packages to npm'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Do everything except the real publish (npm publish --dry-run)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - host: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - host: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc

    name: Build Typesafe ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: typesafe-${{ matrix.settings.target }}

      - name: Install dependencies
        working-directory: npm/packages/typesafe
        run: npm install --ignore-scripts --omit=optional --force

      - name: Clean any stale native artifacts (fresh, deterministic build)
        shell: bash
        run: |
          rm -f npm/packages/typesafe/*.node npm/packages/typesafe/native/*.node
          rm -rf npm/packages/typesafe/native/linux-x64-gnu npm/packages/typesafe/native/linux-arm64-gnu

      # Pyke's prebuilt ort-sys archives require newer glibc/libstdc++ than
      # Ubuntu 22.04. Microsoft's ONNX Runtime 1.28.0 release archives have
      # been checked against that baseline; pin their exact bytes here.
      - name: Fetch pinned ONNX Runtime shared library (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.settings.platform }}' in
            linux-x64-gnu)
              archive_name=onnxruntime-linux-x64-1.28.0.tgz
              archive_sha=a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407
              ;;
            linux-arm64-gnu)
              archive_name=onnxruntime-linux-aarch64-1.28.0.tgz
              archive_sha=e15ff8b5d85afe6c144d97c6fd432254bf76a219daaf17658087d6ecb3e8f0bb
              ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$archive_name"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/$archive_name"
          printf '%s  %s\n' "$archive_sha" "$archive" | sha256sum --check --
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ort" --strip-components=1
          test -f "$RUNNER_TEMP/ort/lib/libonnxruntime.so.1"
          test -f "$RUNNER_TEMP/ort/lib/libonnxruntime_providers_shared.so"
          echo "ORT_LIB_PATH=$RUNNER_TEMP/ort/lib" >> "$GITHUB_ENV"
          echo 'ORT_PREFER_DYNAMIC_LINK=1' >> "$GITHUB_ENV"
          # The published .so sits next to its .node in both npm packages.
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"

      # ort-sys rc.13 has no macOS Intel download. Build the exact ORT source
      # version it targets on a native x86_64 runner. Shared linking avoids
      # rc.13's missing model_package.a entry in its custom static linker.
      - name: Build pinned ONNX Runtime from source (macOS Intel)
        if: matrix.settings.platform == 'darwin-x64'
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --branch v1.28.0 --single-branch --depth 1 \
            https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          test "$(git -C "$RUNNER_TEMP/onnxruntime" rev-parse HEAD)" = \
            da9b5e364c465de65c49d91e696cd6485270757f
          (
            cd "$RUNNER_TEMP/onnxruntime"
            ./build.sh --update --build --config Release --parallel 3 \
              --skip_tests --compile_no_warning_as_error --skip_submodule_sync \
              --build_shared_lib \
              --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64
          )
          test -f "$RUNNER_TEMP/onnxruntime/build/MacOS/Release/libonnxruntime.dylib"
          echo "ORT_LIB_PATH=$RUNNER_TEMP/onnxruntime/build/MacOS/Release" >> "$GITHUB_ENV"
          echo 'ORT_PREFER_DYNAMIC_LINK=1' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,@loader_path' >> "$GITHUB_ENV"

      # napi-rs emits its OWN index.js / index.d.ts into the output directory and
      # will happily overwrite this package's hand-written platform loader with
      # one that exports the bindings but no `backend` — which is exactly how
      # every native leg failed: "binary loads OK" then "selected: undefined".
      # `--js false` suppresses the JS file (the CLI has no --no-js, and the
      # switch only applies when --target is given, which it always is here);
      # the d.ts goes to a scratch name. Both tracked files are then restored
      # and asserted, so the build cannot clobber them whatever a future CLI
      # version decides to generate.
      - name: Build native module (hash and native ONNX)
        working-directory: npm/packages/typesafe
        shell: bash
        run: |
          set -euo pipefail
          npx napi build --platform --release --features native-onnx \
            --cargo-cwd ../../../crates/ruvector-typesafe-ffi \
            --target ${{ matrix.settings.target }} \
            --js false --dts napi-generated.d.ts
          rm -f napi-generated.d.ts
          git checkout -- index.js index.d.ts
          node -e "const s=require('fs').readFileSync('index.js','utf8'); if(!/backend/.test(s)){console.error('index.js is not the hand-written loader after build');process.exit(1)}; console.log('loader intact after napi build')"

      - name: Prepare artifact (rename to the loader's expected name)
        shell: bash
        run: |
          set -euo pipefail
          # index.js's platformMap selects typesafe.<platform>.node, so we
          # rename whatever napi emitted to that deterministic name here. The
          # find covers both the package dir (napi's default output) and the
          # crate dir, exactly as build-router.yml does.
          NODE_FILE=$(find npm/packages/typesafe -maxdepth 1 -name "*.node" -type f | head -1)
          if [ -z "$NODE_FILE" ]; then
            NODE_FILE=$(find crates/ruvector-typesafe-ffi -name "*.node" -type f | head -1)
          fi
          if [ -z "$NODE_FILE" ]; then
            echo "::error::No .node file produced by napi build"
            exit 1
          fi
          echo "Built: $NODE_FILE"
          mkdir -p typesafe-artifacts/${{ matrix.settings.platform }}
          cp -v "$NODE_FILE" "typesafe-artifacts/${{ matrix.settings.platform }}/typesafe.${{ matrix.settings.platform }}.node"
          if [ "$RUNNER_OS" = Linux ]; then
            cp -L "$ORT_LIB_PATH/libonnxruntime.so.1" \
              "typesafe-artifacts/${{ matrix.settings.platform }}/libonnxruntime.so.1"
            # The ORT archive includes this companion; keep it adjacent in
            # case an execution provider is loaded by name at runtime.
            cp -L "$ORT_LIB_PATH/libonnxruntime_providers_shared.so" \
              "typesafe-artifacts/${{ matrix.settings.platform }}/libonnxruntime_providers_shared.so"
          fi
          if [ '${{ matrix.settings.platform }}' = darwin-x64 ]; then
            # CMake gives the dylib a versioned @rpath install name. Derive
            # its exact basename from the addon, then copy the real bytes
            # under that name (GitHub artifacts and npm do not retain symlinks).
            dylib_ref=$(otool -L "$NODE_FILE" | awk '$1 ~ /^@rpath\/libonnxruntime.*\.dylib$/ {print $1}')
            test -n "$dylib_ref"
            dylib_name="${dylib_ref##*/}"
            test -f "$ORT_LIB_PATH/$dylib_name"
            cp -L "$ORT_LIB_PATH/$dylib_name" \
              "typesafe-artifacts/darwin-x64/$dylib_name"
            otool -D "typesafe-artifacts/darwin-x64/$dylib_name" | grep -Fx "$dylib_ref"
          fi

      # Run on each target's actual architecture, including Linux ARM64 and
      # Intel macOS. A skipped or broken binary must block the whole matrix.
      - name: Verify loader picks the native ONNX binary
        shell: bash
        working-directory: npm/packages/typesafe
        run: |
          set -euo pipefail
          binary_dir=native
          if [ "$RUNNER_OS" = Linux ]; then binary_dir="native/${{ matrix.settings.platform }}"; fi
          mkdir -p "$binary_dir"
          cp "$GITHUB_WORKSPACE/typesafe-artifacts/${{ matrix.settings.platform }}/typesafe.${{ matrix.settings.platform }}.node" \
             "$binary_dir/typesafe.${{ matrix.settings.platform }}.node"
          export BINARY_PATH="$binary_dir/typesafe.${{ matrix.settings.platform }}.node"
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$GITHUB_WORKSPACE/typesafe-artifacts/${{ matrix.settings.platform }}/"*.so* "$binary_dir/"
            readelf -d "$BINARY_PATH" | grep -F 'libonnxruntime.so.1'
            readelf -d "$BINARY_PATH" | grep -F '$ORIGIN'
            ldd -r "$BINARY_PATH" | grep -F 'libonnxruntime.so.1'
            unset LD_LIBRARY_PATH
          fi
          if [ '${{ matrix.settings.platform }}' = darwin-x64 ]; then
            dylibs=("$GITHUB_WORKSPACE/typesafe-artifacts/darwin-x64/"libonnxruntime*.dylib)
            test "${#dylibs[@]}" -eq 1 && test -f "${dylibs[0]}"
            dylib_name="${dylibs[0]##*/}"
            cp "${dylibs[0]}" "$binary_dir/"
            otool -L "$BINARY_PATH" | grep -F "@rpath/$dylib_name"
            otool -l "$BINARY_PATH" | awk '/cmd LC_RPATH/{in_path=1} in_path && /path @loader_path/{ok=1} END{exit !ok}'
            otool -D "$binary_dir/$dylib_name" | grep -Fx "@rpath/$dylib_name"
            unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          fi
          node -e "const expected={'linux-x64-gnu':['linux','x64'],'linux-arm64-gnu':['linux','arm64'],'darwin-x64':['darwin','x64'],'darwin-arm64':['darwin','arm64'],'win32-x64-msvc':['win32','x64']}['${{ matrix.settings.platform }}']; if(!expected || process.platform!==expected[0] || process.arch!==expected[1]) throw new Error('matrix target is not the runner architecture')"
          # Two separate assertions, so a failure says which half broke. Loading
          # the binary directly proves the artifact itself is sound (on Windows a
          # missing runtime DLL surfaces here as "The specified module could not
          # be found"); only then is the loader's selection worth blaming.
          node -e "const b=require('./'+process.env.BINARY_PATH); if(typeof b.version!=='function'){console.error('binary loaded but exports no version(): '+Object.keys(b).join(','));process.exit(1)}; console.log('binary loads OK: '+b.version())"
          node -e "const p=require('path').resolve('./index.js'); const m=require(p); if(m.backend!=='native'){console.error('binary loads, but the loader selected: '+m.backend+'\n  resolved: '+p+'\n  exports: '+Object.keys(m).join(',')+'\n  cwd: '+process.cwd());process.exit(1)}; console.log('loader parity OK: backend=native version='+m.version())"
          node -e "const m=require('./index.js'); let err; try { new m.Engine(JSON.stringify({embedder:{kind:'onnx',modelDir:'__probe_absent__',manifest:'{\"models\":[]}'}})); } catch(e) { err=e; } if(!/manifest: no entry named/.test(String(err))){console.error('native binary lacks the ONNX path: '+err);process.exit(1)} console.log('native ONNX path present')"
          node scripts/check-security.mjs --native "$BINARY_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-${{ matrix.settings.platform }}
          path: typesafe-artifacts/${{ matrix.settings.platform }}/*
          if-no-files-found: error

  release-bench:
    name: ONNX ticket evidence (strict for manual publish)
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.publish == true)
    defaults:
      run:
        working-directory: npm/packages/typesafe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Download the exact Linux binary to be published
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: typesafe-linux-x64-gnu
          path: npm/packages/typesafe/native/linux-x64-gnu
      - name: Require the release binary to load as native
        run: |
          test -f native/linux-x64-gnu/libonnxruntime.so.1
          test -f native/linux-x64-gnu/libonnxruntime_providers_shared.so
          node -e "const m=require('./index.js'); if(m.backend!=='native'||typeof m.Engine!=='function'){throw new Error('release binary not loaded')}"
      - name: Reject changed release gates or unpinned model assets
        run: node scripts/verify-release-bench.mjs --preflight-models
      - name: Download and verify hash-pinned model assets
        run: node scripts/fetch-models.mjs --model bge-small-en-v1.5
      - name: Score full frozen ONNX tickets
        run: |
          args=(--suite tickets --arm both --embedder onnx \
            --model bge-small-en-v1.5 --model-dir models --shots 8 \
            --baseline-receipt bench/results/tickets-onnx-bge-2026-09-21.json \
            --gate --out bench/results/ci-release-tickets-onnx.json)
          # PR/push: report quality failures without hiding missing engines or
          # incomplete results. Manual publish: run strict, fail on any gate.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then args+=(--report-only); fi
          node bench/run.mjs "${args[@]}"
      - name: Validate ONNX receipt and applicable gate results
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then args+=(--advisory); fi
          node scripts/verify-release-bench.mjs bench/results/ci-release-tickets-onnx.json "${args[@]}"
      - name: Upload ONNX ticket receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-onnx-ticket-receipt
          path: npm/packages/typesafe/bench/results/ci-release-tickets-onnx.json
          if-no-files-found: warn

  publish:
    name: Publish Typesafe Packages
    runs-on: ubuntu-22.04
    needs: [build, release-bench]
    # Exact shipped binary and frozen ONNX ticket gates must pass first.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Write the registry-verify helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'VERIFY'
          # verify_on_registry <pkg> <version>: poll the npm registry JSON until
          # the exact version is resolvable, or fail after ~3 minutes. We hit the
          # registry directly (not `npm view`, which 404s during propagation).
          verify_on_registry() {
            local pkg="$1" ver="$2"
            local enc="${pkg//\//%2f}"
            local url="https://registry.npmjs.org/${enc}"
            local tmp="$RUNNER_TEMP/reg.json"
            local i
            for i in $(seq 1 18); do
              if curl -sfL "$url" -o "$tmp"; then
                if REG_JSON="$tmp" REG_VER="$ver" node -e 'const d=require(process.env.REG_JSON); process.exit(d.versions && d.versions[process.env.REG_VER] ? 0 : 1)'; then
                  echo "verified ${pkg}@${ver} on the npm registry"
                  return 0
                fi
              fi
              echo "waiting for ${pkg}@${ver} to propagate (attempt ${i}/18)..."
              sleep 10
            done
            echo "::error::${pkg}@${ver} did not appear on the npm registry within ~3 minutes of publish"
            return 1
          }
          VERIFY

      - name: Assert exactly five platform binaries were built
        shell: bash
        run: |
          set -euo pipefail
          count=$(find artifacts -name "typesafe.*.node" -type f | wc -l | tr -d ' ')
          echo "found $count platform binaries"
          find artifacts -name "typesafe.*.node" -type f
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 platform binaries, found $count — refusing to publish a partial set"
            exit 1
          fi

      - name: Publish the five platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/verify.sh"
          VERSION=$(node -p "require('./npm/packages/typesafe/package.json').version")
          echo "Publishing platform packages at version: $VERSION (dry_run=$DRY_RUN)"

          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            NODE_FILE="artifacts/typesafe-${platform}/typesafe.${platform}.node"
            if [ ! -f "$NODE_FILE" ]; then
              echo "::error::missing binary for ${platform} at ${NODE_FILE}"
              exit 1
            fi

            case "$platform" in
              linux-x64-gnu)   OS="linux";  CPU="x64";   LIBC='"libc": ["glibc"],' ;;
              linux-arm64-gnu) OS="linux";  CPU="arm64"; LIBC='"libc": ["glibc"],' ;;
              darwin-x64)      OS="darwin"; CPU="x64";   LIBC="" ;;
              darwin-arm64)    OS="darwin"; CPU="arm64"; LIBC="" ;;
              win32-x64-msvc)  OS="win32";  CPU="x64";   LIBC="" ;;
            esac

            NODE_NAME="typesafe.${platform}.node"
            PKG_DIR="npm-pkg/typesafe-${platform}"
            mkdir -p "$PKG_DIR"
            cp "$NODE_FILE" "$PKG_DIR/$NODE_NAME"
            if [ "$OS" = linux ]; then
              for lib in libonnxruntime.so.1 libonnxruntime_providers_shared.so; do
                cp "artifacts/typesafe-${platform}/$lib" "$PKG_DIR/$lib"
              done
              PACKAGE_FILES="[\"${NODE_NAME}\", \"libonnxruntime.so.1\", \"libonnxruntime_providers_shared.so\"]"
            elif [ "$platform" = darwin-x64 ]; then
              dylibs=(artifacts/typesafe-darwin-x64/libonnxruntime*.dylib)
              test "${#dylibs[@]}" -eq 1 && test -f "${dylibs[0]}"
              dylib_name="${dylibs[0]##*/}"
              cp "${dylibs[0]}" "$PKG_DIR/$dylib_name"
              PACKAGE_FILES="[\"${NODE_NAME}\", \"${dylib_name}\"]"
            else
              PACKAGE_FILES="[\"${NODE_NAME}\"]"
            fi

            cat > "$PKG_DIR/package.json" <<EOF
          {
            "name": "@ruvector/typesafe-${platform}",
            "version": "${VERSION}",
            "os": ["${OS}"],
            "cpu": ["${CPU}"],
            ${LIBC}
            "main": "${NODE_NAME}",
            "files": ${PACKAGE_FILES},
            "description": "Local typed decisions over embeddings (@ruvector/typesafe) - ${platform} native binary",
            "keywords": ["ruvector", "typesafe", "decisions", "napi-rs"],
            "author": "ruv.io Team <info@ruv.io>",
            "license": "MIT",
            "repository": {"type": "git", "url": "https://github.com/ruvnet/ruvector"},
            "engines": {"node": ">= 18"},
            "publishConfig": {"registry": "https://registry.npmjs.org/", "access": "public"}
          }
          EOF

            echo "=== @ruvector/typesafe-${platform}@${VERSION} ==="
            (
              cd "$PKG_DIR"
              if [ "$DRY_RUN" = "true" ]; then
                npm publish --access public --dry-run
              else
                # A version conflict is fatal: verifying only that the name and
                # version exist could accept a prior hash-only binary release.
                npm publish --access public
              fi
            )
            if [ "$DRY_RUN" != "true" ]; then
              verify_on_registry "@ruvector/typesafe-${platform}" "$VERSION" || exit 1
            fi
          done

          echo "all five platform packages handled"

      - name: Publish the meta package (only after all five platforms verified)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/verify.sh"
          VERSION=$(node -p "require('./npm/packages/typesafe/package.json').version")

          # The meta package has no optionalDependencies yet, so bundle all five
          # binaries and their runtime libraries. Each Linux architecture gets
          # its own directory because both use the SONAME libonnxruntime.so.1;
          # index.js selects the directory for the running architecture.
          mkdir -p npm/packages/typesafe/native
          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            out_dir=npm/packages/typesafe/native
            if [[ "$platform" == linux-* ]]; then
              out_dir="npm/packages/typesafe/native/$platform"
              mkdir -p "$out_dir"
              cp "artifacts/typesafe-${platform}/libonnxruntime.so.1" "$out_dir/"
              cp "artifacts/typesafe-${platform}/libonnxruntime_providers_shared.so" "$out_dir/"
            fi
            cp "artifacts/typesafe-${platform}/typesafe.${platform}.node" \
               "$out_dir/typesafe.${platform}.node"
            if [ "$platform" = darwin-x64 ]; then
              dylibs=(artifacts/typesafe-darwin-x64/libonnxruntime*.dylib)
              test "${#dylibs[@]}" -eq 1 && test -f "${dylibs[0]}"
              cp "${dylibs[0]}" "$out_dir/"
            fi
          done
          echo "bundled native binaries:"
          find npm/packages/typesafe/native -name '*.node' -type f -print

          # Build dist/ (main = dist/index.js). Use the pinned tsc invocation the
          # package's CI uses; a bare `npx tsc` misbehaves in this monorepo.
          (
            cd npm/packages/typesafe
            npm install --no-audit --no-fund --no-workspaces --legacy-peer-deps
            npx -y -p typescript@5.9.3 tsc -p tsconfig.json
          )

          cd npm/packages/typesafe
          if [ "$DRY_RUN" = "true" ]; then
            # Prove the tarball contains dist/index.js and all five binaries.
            npm publish --access public --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pack.txt"
            dylibs=(native/libonnxruntime*.dylib)
            test "${#dylibs[@]}" -eq 1 && test -f "${dylibs[0]}"
            for f in dist/index.js native/linux-x64-gnu/typesafe.linux-x64-gnu.node native/linux-x64-gnu/libonnxruntime.so.1 native/linux-x64-gnu/libonnxruntime_providers_shared.so native/linux-arm64-gnu/typesafe.linux-arm64-gnu.node native/linux-arm64-gnu/libonnxruntime.so.1 native/linux-arm64-gnu/libonnxruntime_providers_shared.so native/typesafe.darwin-x64.node "${dylibs[0]}" native/typesafe.darwin-arm64.node native/typesafe.win32-x64-msvc.node; do
              if ! grep -q "$f" "$RUNNER_TEMP/pack.txt"; then
                echo "::error::dry-run tarball is missing $f"
                exit 1
              fi
            done
            echo "dry-run tarball contains dist/index.js and all five native binaries"
          else
            # --ignore-scripts skips prepublishOnly's bare `tsc`; dist is already built.
            npm publish --access public --ignore-scripts
            verify_on_registry "@ruvector/typesafe" "$VERSION" || exit 1
          fi
