name: Python Wheels (ruvector)

# ADR-352 / docs/sdk/02-strategy.md "Wheel distribution matrix": 5 abi3-py39
# wheels (one per platform, not per Python version) via maturin + PyO3.
#
# Deviates from 02-strategy's literal "cibuildwheel" choice: uses
# PyO3/maturin-action instead. cibuildwheel's manylinux containers and
# auditwheel pass are tuned for C-extension wheels that already have a
# compiled .so to repair; a Rust crate needs the matching Rust target
# installed and cross-linked, which maturin-action (same PyO3 org) handles
# natively (manylinux container + the right target + abi3 in one action
# input), without re-deriving cibuildwheel's own container/cross config for
# a toolchain it wasn't built around. Verified via `gh api
# repos/pola-rs/polars/contents/.github/workflows/release-python.yml` and
# repos/pydantic/pydantic-core/.../ci.yml: both (cited as precedent in
# 02-strategy) use `PyO3/maturin-action@v1`, not cibuildwheel.
on:
  pull_request:
    paths:
      - 'crates/ruvector-py/**'
      - 'crates/ruvector-rabitq/**'
      - '.github/workflows/python-wheels.yml'
  push:
    branches: [main]
    tags:
      - 'python-v*'
    paths:
      - 'crates/ruvector-py/**'
      - 'crates/ruvector-rabitq/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  PACKAGE_DIR: crates/ruvector-py

jobs:
  rust-tests:
    # ruvector-py's own Rust unit tests (49, under crates/ruvector-py/src/).
    # release.yml's "validate"/"build-crates" jobs explicitly `--exclude
    # ruvector-py` (their pyo3 `extension-module` comment explains why: a
    # bare ubuntu-22.04 runner with no Python dev headers can't link a test
    # binary against libpython). This job is the other half of that split —
    # a runner that DOES set up Python (via actions/setup-python, same as
    # the `linux` wheel job below) so `cargo test -p ruvector-py` can link
    # dynamically. Confirmed locally first: with a venv's `python3` on
    # PATH and no `extension-module` Cargo feature (see that crate's
    # Cargo.toml comment), `cargo test -p ruvector-py --release` links and
    # passes all 49 tests with no extra PYO3_PYTHON/pkg-config wiring needed.
    name: Rust unit tests (ruvector-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: 'v1-rust'
          shared-key: 'ruvector-py-rust-tests'

      - name: cargo test -p ruvector-py
        run: cargo test -p ruvector-py --release

  linux:
    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            container: auto
          - target: aarch64
            runner: ubuntu-24.04-arm
            container: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Build abi3 wheel (manylinux_2_28)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.target }}
          # aarch64 leg only: `manylinux: 2_28` here (no `container:` override)
          # made maturin-action select the x86_64 CROSS manylinux image
          # (`ghcr.io/rust-cross/manylinux_2_28-cross:x86_64`, needing an
          # `aarch64-linux-gnu-gcc` cross-linker that plain Ubuntu doesn't
          # ship) even though `runs-on: ubuntu-24.04-arm` is a NATIVE arm64
          # runner — confirmed via a real CI run, not guessed (maturin-action
          # error: "linker `aarch64-linux-gnu-gcc` not found"). Its own table
          # says a native arm64 host + aarch64 target should pick the native
          # `quay.io/pypa/manylinux_2_28_aarch64` image instead; this matrix
          # leg hit that mismatch in practice. `container: 'off'` (its own
          # documented escape hatch: "disable manylinux docker build and
          # build on the host instead") sidesteps the container-selection
          # logic entirely — correct since the host already IS real aarch64
          # Linux.
          #
          # **Second real bug found on the next CI run, after `container:
          # 'off'` alone**: `manylinux: 2_28` still asked maturin to run its
          # own manylinux-compliance check against the resulting binary even
          # with no container — and the native `ubuntu-24.04-arm` runner's
          # host glibc is newer than the manylinux_2_28 floor, so the build
          # now compiles fine and then maturin itself fails post-build:
          # "Your library is not manylinux_2_28 compliant because of the
          # presence of too-recent versioned symbols: libc.so.6 offending
          # versions: GLIBC_2.30, GLIBC_2.33, GLIBC_2.34" (real error text
          # from a real CI run, not guessed). `manylinux: off` for this leg
          # (not `2_28`) turns off that compliance check entirely, which is
          # the correct pairing with `container: 'off'` — building on the
          # bare host and then still demanding a container-grade glibc floor
          # was never going to hold. Tradeoff (already true before this
          # fix, just now actually reachable instead of erroring out first):
          # the wheel loses the `manylinux_2_28` platform tag (gets a plain
          # `linux_aarch64` tag instead), which is less portable for a PyPI
          # upload than a true manylinux wheel — accepted for now; revisit
          # with real iterative access to an aarch64 runner before
          # publishing for real (ADR-352/LOOP-STATE tracks this).
          manylinux: ${{ matrix.target == 'aarch64' && 'off' || '2_28' }}
          container: ${{ matrix.target == 'aarch64' && 'off' || '' }}
          args: --release --out dist

      - name: Test wheel
        # `ubuntu-24.04-arm` is a native ARM64 GitHub-hosted runner (not QEMU
        # emulation), so the aarch64 wheel built above runs directly here —
        # no cross-arch skip needed on either leg of this matrix.
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl pytest numpy
          /tmp/wheel-venv/bin/python -m pytest tests/test_smoke.py tests/test_collection.py -q

      - name: Wheel size budget (<= 8 MiB, docs/sdk/04-milestones.md M1 acceptance test 7)
        if: matrix.target == 'x86_64'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          size=$(stat -c%s dist/*.whl)
          echo "wheel size: $size bytes"
          test "$size" -le 8388608 || { echo "wheel exceeds 8 MiB budget"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl

  macos:
    runs-on: macos-14
    name: macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Test wheel (native arch only)
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl pytest numpy
          /tmp/wheel-venv/bin/python -m pytest tests/test_smoke.py tests/test_collection.py -q

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl

  windows:
    runs-on: windows-latest
    name: Windows x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: x86_64-pc-windows-msvc
          args: --release --out dist

      - name: Test wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/Scripts/pip install dist/*.whl pytest numpy
          /tmp/wheel-venv/Scripts/python -m pytest tests/test_smoke.py tests/test_collection.py -q

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-windows-x86_64
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl

  # Trusted publishing (PyPI OIDC, no stored token — https://docs.pypi.org/trusted-publishers/)
  # requires a one-time PyPI-side publisher registration for this repo/workflow before it can
  # succeed; left gated on a real tag/dispatch input so this workflow landing does NOT publish
  # anything by itself (ADR-352 task boundary: prepare publishing, do not execute it).
  publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/python-v') || github.event.inputs.publish == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
