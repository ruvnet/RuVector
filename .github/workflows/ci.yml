name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Skip building unused proc-macro features in test bin link steps
  CARGO_INCREMENTAL: 0

jobs:
  workspace-membership:
    name: Workspace membership guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Check crates/ for orphan crates (PIR #859)
        run: node scripts/workspace-check.mjs

  adr-numbering:
    name: ADR numbering guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      # scripts/adr-index.mjs has always exited 1 on a duplicate ADR number,
      # but nothing invoked it, so duplicates reached review green. See
      # ADR-316 for the numbering policy.
      - name: Check docs/adr/ for duplicate ADR numbers (ADR-316)
        run: node scripts/adr-index.mjs --check

  frozen-weights:
    name: Frozen-weights structural gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Self-test the gate (PIR #841, ADR-313)
        run: node scripts/frozen-weights-check.mjs --self-test

      - name: Scan evolution-loop mutation surfaces for training/weight APIs
        run: node scripts/frozen-weights-check.mjs

  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Cargo check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Cargo check (workspace)
        run: cargo check --workspace --exclude ruvector-postgres

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude ruvector-postgres --all-targets -- -W warnings

  # The full workspace test suite exceeds the 30-minute timeout on a single
  # runner. We split the work into parallel matrix jobs grouped by domain so
  # each shard fits comfortably under the timeout, and use `cargo-nextest` for
  # faster test discovery and execution.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-22.04
    # `core-and-rest` is the catch-all shard and compiles ~50 crates; on a
    # cold cache the build alone has hit ~90min, so headroom matters more
    # than tight feedback for this job. Faster shards still finish in ~10–20m.
    # Iter 231 — bumped 150→180. Historical successful runs landed at
    # 2h 30m 16s (just under the old cap); two PR-413 runs (iter 228 +
    # iter 230) both hit the cap and got cancelled mid-test. Excluding
    # the iter-219 hailo crates from the catch-all (iter 230) was a
    # necessary but not sufficient fix — the shard was already at the
    # ragged edge. Iter 232+ — natural duration drifted to 155–165 min
    # (ci/supply-chain-guards branch), hitting the 180-min cap. Bumped
    # 180→240 to restore headroom. The right long-term fix is to split
    # heavy crates out into a new sibling shard.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vector-index
            packages: >-
              -p ruvector-rabitq
              -p ruvector-rulake
              -p ruvector-diskann
              -p ruvector-graph
              -p ruvector-gnn
              -p ruvector-cnn
          - name: rvagent
            packages: >-
              -p rvagent-a2a
              -p rvagent-acp
              -p rvagent-backends
              -p rvagent-cli
              -p rvagent-core
              -p rvagent-mcp
              -p rvagent-middleware
              -p rvagent-subagents
              -p rvagent-tools
              -p rvagent-wasm
          - name: ruvix
            packages: >-
              -p ruvix-aarch64
              -p ruvix-bench
              -p ruvix-boot
              -p ruvix-cap
              -p ruvix-demo
              -p ruvix-drivers
              -p ruvix-hal
              -p ruvix-integration
              -p ruvix-nucleus
              -p ruvix-proof
              -p ruvix-queue
              -p ruvix-region
              -p ruvix-sched
              -p ruvix-shell
              -p ruvix-types
              -p ruvix-vecgraph
          - name: ml-research-heavy
            # Heaviest crates split into their own shard so ml-research
            # doesn't exceed the 45-min timeout.
            packages: >-
              -p ruvector-attention
              -p ruvector-mincut
              -p ruvector-fpga-transformer
              -p ruvector-graph-transformer
          - name: ml-research-rest
            packages: >-
              -p ruvector-scipix
              -p ruvector-sparse-inference
              -p ruvector-sparsifier
              -p ruvector-solver
              -p ruvector-domain-expansion
              -p ruvector-robotics
          - name: core-and-rest-heavy
            # Hoist the known-heavy long-tail crates out of core-and-rest
            # so neither shard exceeds the 90-min timeout.
            packages: >-
              -p ruvllm
              -p ruvllm-cli
              -p ruvector-dag
              -p ruvector-nervous-system
              -p ruvector-math
              -p ruvector-consciousness
              -p prime-radiant
              -p mcp-brain
              -p ruvector-decompiler
          - name: core-and-rest-wasm
            # Iter 232 — split out the *-wasm crates from core-and-rest
            # because the catch-all shard had grown to 115 crates and was
            # consistently missing the 180min cap (iter-228 + iter-230 +
            # iter-231 all cancelled at the timeout boundary). The wasm
            # crates are a natural sub-group: thin bindings on top of host
            # crates, easy to compile + test in isolation.
            #
            # Iter 233 — `ruvllm-wasm` is excluded from native nextest: 11 of
            # its 195 tests (sona_instant + workers::feature_detect) fail or
            # SIGABRT on native because they are wasm-target specific and need
            # wasm-bindgen-test. Surfaced by the iter-232 split; previously
            # masked by the iter-228..231 timeout cancellations of the mega
            # shard. Fix is to gate the affected modules behind
            # `#[cfg(target_arch = "wasm32")]` or migrate them to
            # wasm-bindgen-test runners.
            #
            # NOTE: comments must stay above `packages:`. Inside the folded
            # scalar they are content, not YAML comments, and the shell
            # truncates the expanded command line at the first `#`.
            packages: >-
              -p neural-trader-wasm
              -p ruvector-acorn-wasm
              -p ruvector-attention-unified-wasm
              -p ruvector-attention-wasm
              -p ruvector-cnn-wasm
              -p ruvector-consciousness-wasm
              -p ruvector-dag-wasm
              -p ruvector-decompiler-wasm
              -p ruvector-delta-wasm
              -p ruvector-domain-expansion-wasm
              -p ruvector-economy-wasm
              -p ruvector-exotic-wasm
              -p ruvector-fpga-transformer-wasm
              -p ruvector-gnn-wasm
              -p ruvector-graph-condense-wasm
              -p ruvector-graph-transformer-wasm
              -p ruvector-graph-wasm
              -p ruvector-learning-wasm
              -p ruvector-math-wasm
              -p ruvector-mincut-gated-transformer-wasm
              -p ruvector-mincut-wasm
              -p ruvector-nervous-system-wasm
              -p ruvector-rabitq-wasm
              -p ruvector-router-wasm
              -p ruvector-solver-wasm
              -p ruvector-sparsifier-wasm
              -p ruvector-tiny-dancer-wasm
              -p ruvector-verified-wasm
              -p ruvector-wasm
          - name: research-nightly
            # Nightly research PoC crates (iter 240+). Kept in a separate shard
            # so their compile + test time doesn't inflate core-and-rest.
            # timeout-minutes is intentionally tight — if a research crate
            # takes more than 30 min it signals an unbounded benchmark in tests.
            packages: >-
              -p ruvector-lsm-ann
              -p ruvector-matryoshka
              -p ruvector-pq-search
              -p ruvector-hybrid
              -p ruvector-hnsw-repair
              -p ruvector-coherence-hnsw
              -p ruvector-maxsim
              -p photonlayer-core
              -p photonlayer-bench
              -p photonlayer-cli
              -p photonlayer-wasm
              -p photonlayer-ruvector
            timeout-minutes: 30
          - name: core-and-rest-examples
            # Example and application crates used to live in the catch-all
            # shard, which now reaches the 240-minute job timeout. Keep them
            # together in a parallel shard so they still receive tests and
            # doctests without blocking the core library crates.
            packages: >-
              -p a2a-swarm
              -p boundary-discovery
              -p brain-boundary-discovery
              -p climate-consciousness
              -p cmb-boundary-discovery
              -p cmb-consciousness
              -p earthquake-boundary-discovery
              -p ecosystem-consciousness
              -p frb-boundary-discovery
              -p gene-consciousness
              -p gw-consciousness
              -p health-boundary-discovery
              -p infrastructure-boundary-discovery
              -p market-boundary-discovery
              -p music-boundary-discovery
              -p pandemic-boundary-discovery
              -p quantum-consciousness
              -p real-eeg-analysis
              -p real-eeg-multi-seizure
              -p refrag-pipeline-example
              -p ruvector-benchmarks
              -p ruvector-cloudrun-gpu
              -p ruvector-robotics-examples
              -p rvf-kernel-optimized
              -p seizure-clinical-report
              -p seizure-therapeutic-sim
              -p seti-boundary-discovery
              -p seti-exotic-signals
              -p sky-monitor
              -p sky-monitor-wasm
              -p subpolynomial-time-mincut-demo
              -p temporal-attractor-discovery
              -p train-discoveries
              -p verified-applications
              -p void-boundary-discovery
              -p weather-boundary-discovery
          - name: core-platform
            # Services, distributed infrastructure, and native Node bindings
            # form a coherent dependency cluster. Keep them out of the
            # catch-all so its remaining core libraries compile within the
            # job timeout even on a cold cache.
            #
            # `ruvector-delta-index` rejoined after the #825 fix: the hang
            # was a self-deadlock in connect_node's prune branch (write lock
            # held while re-read-locking the same node), fixed by borrowing
            # the vector from the held guard. The suite now carries a seeded,
            # prune-heavy regression test that completes in under a second.
            packages: >-
              -p mcp-brain-server
              -p mcp-gate
              -p ruvector-cli
              -p ruvector-delta-index
              -p ruvector-cluster
              -p ruvector-cluster-rag
              -p ruvector-delta-consensus
              -p ruvector-delta-core
              -p ruvector-delta-graph
              -p ruvector-namespace-merge
              -p ruvector-raft
              -p ruvector-replication
              -p ruvector-router-cli
              -p ruvector-router-core
              -p ruvector-router-ffi
              -p ruvector-server
              -p ruvector-snapshot
              -p ruvector-attention-node
              -p ruvector-diskann-node
              -p ruvector-gnn-node
              -p ruvector-graph-node
              -p ruvector-graph-transformer-node
              -p ruvector-mincut-node
              -p ruvector-node
              -p ruvector-solver-node
              -p ruvector-tiny-dancer-node
          - name: core-and-rest
            # Everything else: core, delta, server/cluster, etc.
            # Uses --workspace + --exclude to subtract the groups above so we
            # don't have to enumerate ~100 crates by hand.
            #
            # The exclude list below subtracts, in order: the nightly research
            # crates (research-nightly shard, iter 240+), the example and
            # application crates (core-and-rest-examples), the service,
            # distributed and Node-binding crates (core-platform), the heavy
            # long-tail crates (core-and-rest-heavy), the domain shards
            # (vector-index, rvagent, ruvix, ml-research-*), and the wasm
            # crates (core-and-rest-wasm). `ruvector-postgres`, `timesfm`,
            # `ruvllm-wasm`, and the hailo crates are held out of native
            # nextest entirely. `ruvector-delta-index` runs in core-platform
            # again since the #825 deadlock fix.
            #
            # NOTE: every comment must stay above `packages:`. A `#` inside
            # the folded scalar is content, not a YAML comment — folding joins
            # it onto one line and the shell then truncates the expanded
            # command at the first `#`, silently dropping every --exclude that
            # follows and running the whole 210-crate workspace instead.
            packages: >-
              --workspace
              --exclude photonlayer-core
              --exclude photonlayer-bench
              --exclude photonlayer-cli
              --exclude photonlayer-wasm
              --exclude photonlayer-ruvector
              --exclude ruvector-lsm-ann
              --exclude ruvector-matryoshka
              --exclude ruvector-pq-search
              --exclude ruvector-hybrid
              --exclude ruvector-hnsw-repair
              --exclude ruvector-coherence-hnsw
              --exclude ruvector-maxsim
              --exclude a2a-swarm
              --exclude boundary-discovery
              --exclude brain-boundary-discovery
              --exclude climate-consciousness
              --exclude cmb-boundary-discovery
              --exclude cmb-consciousness
              --exclude earthquake-boundary-discovery
              --exclude ecosystem-consciousness
              --exclude frb-boundary-discovery
              --exclude gene-consciousness
              --exclude gw-consciousness
              --exclude health-boundary-discovery
              --exclude infrastructure-boundary-discovery
              --exclude market-boundary-discovery
              --exclude music-boundary-discovery
              --exclude pandemic-boundary-discovery
              --exclude quantum-consciousness
              --exclude real-eeg-analysis
              --exclude real-eeg-multi-seizure
              --exclude refrag-pipeline-example
              --exclude ruvector-benchmarks
              --exclude ruvector-cloudrun-gpu
              --exclude ruvector-robotics-examples
              --exclude rvf-kernel-optimized
              --exclude seizure-clinical-report
              --exclude seizure-therapeutic-sim
              --exclude seti-boundary-discovery
              --exclude seti-exotic-signals
              --exclude sky-monitor
              --exclude sky-monitor-wasm
              --exclude subpolynomial-time-mincut-demo
              --exclude temporal-attractor-discovery
              --exclude train-discoveries
              --exclude verified-applications
              --exclude void-boundary-discovery
              --exclude weather-boundary-discovery
              --exclude mcp-brain-server
              --exclude mcp-gate
              --exclude ruvector-cli
              --exclude ruvector-cluster
              --exclude ruvector-cluster-rag
              --exclude ruvector-delta-consensus
              --exclude ruvector-delta-core
              --exclude ruvector-delta-graph
              --exclude ruvector-delta-index
              --exclude ruvector-namespace-merge
              --exclude ruvector-raft
              --exclude ruvector-replication
              --exclude ruvector-router-cli
              --exclude ruvector-router-core
              --exclude ruvector-router-ffi
              --exclude ruvector-server
              --exclude ruvector-snapshot
              --exclude ruvector-attention-node
              --exclude ruvector-diskann-node
              --exclude ruvector-gnn-node
              --exclude ruvector-graph-node
              --exclude ruvector-graph-transformer-node
              --exclude ruvector-mincut-node
              --exclude ruvector-node
              --exclude ruvector-solver-node
              --exclude ruvector-tiny-dancer-node
              --exclude ruvector-postgres
              --exclude ruvector-decompiler
              --exclude timesfm
              --exclude ruvllm
              --exclude ruvllm-cli
              --exclude ruvector-dag
              --exclude ruvector-nervous-system
              --exclude ruvector-math
              --exclude ruvector-consciousness
              --exclude prime-radiant
              --exclude mcp-brain
              --exclude ruvector-rabitq
              --exclude ruvector-rulake
              --exclude ruvector-diskann
              --exclude ruvector-graph
              --exclude ruvector-gnn
              --exclude ruvector-cnn
              --exclude rvagent-a2a
              --exclude rvagent-acp
              --exclude rvagent-backends
              --exclude rvagent-cli
              --exclude rvagent-core
              --exclude rvagent-mcp
              --exclude rvagent-middleware
              --exclude rvagent-subagents
              --exclude rvagent-tools
              --exclude rvagent-wasm
              --exclude ruvix-aarch64
              --exclude ruvix-bench
              --exclude ruvix-boot
              --exclude ruvix-cap
              --exclude ruvix-demo
              --exclude ruvix-drivers
              --exclude ruvix-hal
              --exclude ruvix-integration
              --exclude ruvix-nucleus
              --exclude ruvix-proof
              --exclude ruvix-queue
              --exclude ruvix-region
              --exclude ruvix-sched
              --exclude ruvix-shell
              --exclude ruvix-types
              --exclude ruvix-vecgraph
              --exclude ruvector-attention
              --exclude ruvector-mincut
              --exclude ruvector-scipix
              --exclude ruvector-fpga-transformer
              --exclude ruvector-sparse-inference
              --exclude ruvector-sparsifier
              --exclude ruvector-solver
              --exclude ruvector-graph-transformer
              --exclude ruvector-domain-expansion
              --exclude ruvector-robotics
              --exclude hailort-sys
              --exclude ruvector-hailo
              --exclude ruvector-mmwave
              --exclude ruvector-hailo-cluster
              --exclude neural-trader-wasm
              --exclude ruvector-acorn-wasm
              --exclude ruvector-attention-unified-wasm
              --exclude ruvector-attention-wasm
              --exclude ruvector-cnn-wasm
              --exclude ruvector-consciousness-wasm
              --exclude ruvector-dag-wasm
