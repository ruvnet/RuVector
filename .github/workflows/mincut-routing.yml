name: MinCut road routing
on:
  pull_request:
    paths:
      - 'crates/ruvector-mincut/src/routing/**'
      - 'crates/ruvector-mincut/tests/routing_kernel.rs'
      - 'crates/ruvector-mincut/benchmarks/*roads*'
      - 'crates/ruvector-mincut/benchmarks/routing*'
      - 'crates/ruvector-mincut-node/src/routing.rs'
      - 'crates/ruvector-mincut-wasm/src/routing.rs'
      - 'npm/packages/mincut-wasm/routing/**'
      - '.github/workflows/mincut-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roads:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Independent directed and turn-state oracle tests
        run: |
          cargo test -p ruvector-mincut --release --test routing_kernel
          rustfmt --check --edition=2021 crates/ruvector-mincut/src/routing/mod.rs crates/ruvector-mincut/src/routing/rufield.rs crates/ruvector-mincut-node/src/routing.rs crates/ruvector-mincut-wasm/src/routing.rs crates/ruvector-mincut/tests/routing_kernel.rs crates/ruvector-mincut/benchmarks/routing_real.rs crates/ruvector-mincut/benchmarks/rufield_real.rs
      # The DIMACS 9th challenge files are gone from diag.uniroma1.it (404).
      # Fetch them once into the Actions cache from the original host or the
      # Internet Archive copies, verified against the hashes prepare_roads.py
      # pins; prepare_roads.py skips downloading files already present and
      # re-checks the same hashes.
      - name: Restore DIMACS road sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/roads/USA-road-d.*.gz
          key: dimacs-usa-road-d-ny-bay-7b2446c7-02547a62-630c4a96-67330855
      - name: Fetch DIMACS road sources (sha256-pinned)
        run: |
          set -euo pipefail
          mkdir -p /tmp/roads
          cd /tmp/roads
          cat > SHA256SUMS <<'EOF'
          7b2446c7ffe6179efbc42af6812448e8cb782f12968ca2bb1d50d979343056d4  USA-road-d.NY.gr.gz
          02547a628742164e02bd73f59e33a65d23dfac8fc54c09275c8b9169c38eafdf  USA-road-d.NY.co.gz
          630c4a96869b3ecdd631ceb0f63923fb954ee4c7c26d983863612e2c4442462e  USA-road-d.BAY.gr.gz
          67330855e3082dae03609f5b3012fe13ad2d982139d79c3040e77dad55ffd338  USA-road-d.BAY.co.gz
          EOF
          sed -i 's/^ *//' SHA256SUMS
          while read -r sum name; do
            if [ -f "$name" ] && echo "$sum  $name" | sha256sum -c --status; then continue; fi
            rm -f "$name"
            for base in \
              https://www.diag.uniroma1.it/challenge9/data/USA-road-d \
              https://web.archive.org/web/2024id_/https://www.diag.uniroma1.it/challenge9/data/USA-road-d \
              https://web.archive.org/web/2019id_/http://www.dis.uniroma1.it/challenge9/data/USA-road-d; do
              if curl -fsSL --retry 3 --retry-delay 5 --max-time 300 -o "$name.part" "$base/$name" \
                 && echo "$sum  $name.part" | sha256sum -c --status; then
                mv "$name.part" "$name"; echo "fetched $name from $base"; break
              fi
              rm -f "$name.part"
            done
            [ -f "$name" ] || { echo "no source with the pinned sha256 for $name" >&2; exit 1; }
          done < SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Pinned real roads and independent igraph oracle
        run: |
          python -m pip install igraph==0.11.9 texttable==1.7.0
          python crates/ruvector-mincut/benchmarks/prepare_roads.py --output /tmp/roads
      - name: Paired exact routes, closure recovery and map lookup
        run: |
          cargo build -p ruvector-mincut --release --example routing_real
          /usr/bin/time -v target/release/examples/routing_real /tmp/roads/NY.roads > /tmp/roads/NY-results.jsonl 2> /tmp/roads/NY-resource.txt
          /usr/bin/time -v target/release/examples/routing_real /tmp/roads/BAY.roads > /tmp/roads/BAY-results.jsonl 2> /tmp/roads/BAY-resource.txt
          python crates/ruvector-mincut/benchmarks/summarize_roads.py /tmp/roads
          cargo build -p ruvector-mincut --release --example rufield_real
          target/release/examples/rufield_real /tmp/roads/NY.roads | tee /tmp/roads/NY-rufield.jsonl
          target/release/examples/rufield_real /tmp/roads/BAY.roads | tee /tmp/roads/BAY-rufield.jsonl
          rustc --version > /tmp/roads/compiler.txt
          lscpu > /tmp/roads/cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mincut-road-evidence
          path: |
            /tmp/roads/*.json
            /tmp/roads/*.jsonl
            /tmp/roads/*-resource.txt
            /tmp/roads/*.roads
            /tmp/roads/compiler.txt
            /tmp/roads/cpu.txt
