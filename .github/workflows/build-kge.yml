name: Build KGE Native Modules

# DEPENDENCY: the @ruvector/kge package lives at npm/packages/kge on the
# sibling branch feat/kge-package (stacked on feat/typesafe-package). This
# workflow is a no-op until that branch merges — the `build` job will fail at
# `npm install` because npm/packages/kge does not exist on this branch. It is
# committed here so a single PR carries both platform-build workflows; do not
# dispatch it until feat/kge-package has landed on main.
#
# Modelled on build-router.yml / build-typesafe.yml — same runners, same pinned
# action SHAs, same napi invocation, same five-platform matrix.
#
# Deliberate deviations from build-router.yml (same as build-typesafe.yml):
#   1. Publish is gated ONLY on a manual workflow_dispatch with `publish: true`
#      (no `v*` tag auto-publish).
#   2. Publishing fails loudly and is verified on the registry.
#
# The ruvector-kge-ffi crate has no optional features (no ONNX), so the default
# napi build is the only build — nothing to gate off. The shipped binaries are
# network-free.

on:
  push:
    branches: [main]
    paths:
      - 'crates/ruvector-kge-ffi/**'
      - 'crates/ruvector-kge/**'
      - 'npm/packages/kge/**'
      - '.github/workflows/build-kge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ruvector-kge-ffi/**'
      - 'crates/ruvector-kge/**'
      - 'npm/packages/kge/**'
      - '.github/workflows/build-kge.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the platform + meta packages to npm'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Do everything except the real publish (npm publish --dry-run)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - host: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
          - host: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc

    name: Build KGE ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: kge-${{ matrix.settings.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.settings.platform == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        working-directory: npm/packages/kge
        run: npm install --ignore-scripts --omit=optional --force

      - name: Clean any stale native artifacts (fresh, deterministic build)
        shell: bash
        run: |
          rm -f npm/packages/kge/*.node npm/packages/kge/native/*.node || true

      - name: Build native module (default features)
        working-directory: npm/packages/kge
        run: |
          npx napi build --platform --release --cargo-cwd ../../../crates/ruvector-kge-ffi --target ${{ matrix.settings.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (rename to the loader's expected name)
        shell: bash
        run: |
          set -euo pipefail
          # index.js's platformMap loads native/kge.<platform>.node, so rename
          # whatever napi emitted to that deterministic name here.
          NODE_FILE=$(find npm/packages/kge -maxdepth 1 -name "*.node" -type f | head -1)
          if [ -z "$NODE_FILE" ]; then
            NODE_FILE=$(find crates/ruvector-kge-ffi -name "*.node" -type f | head -1)
          fi
          if [ -z "$NODE_FILE" ]; then
            echo "::error::No .node file produced by napi build"
            exit 1
          fi
          echo "Built: $NODE_FILE"
          mkdir -p kge-artifacts/${{ matrix.settings.platform }}
          cp -v "$NODE_FILE" "kge-artifacts/${{ matrix.settings.platform }}/kge.${{ matrix.settings.platform }}.node"

      # Loader parity check on native-arch legs — proves index.js selects the
      # native backend by the published filename. linux-arm64 is cross-compiled.
      - name: Verify loader picks the native binary
        if: |
          (matrix.settings.platform == 'linux-x64-gnu' && runner.os == 'Linux') ||
          (matrix.settings.platform == 'darwin-x64' && runner.os == 'macOS' && runner.arch == 'X64') ||
          (matrix.settings.platform == 'darwin-arm64' && runner.os == 'macOS' && runner.arch == 'ARM64') ||
          (matrix.settings.platform == 'win32-x64-msvc' && runner.os == 'Windows')
        shell: bash
        working-directory: npm/packages/kge
        run: |
          set -euo pipefail
          mkdir -p native
          cp "$GITHUB_WORKSPACE/kge-artifacts/${{ matrix.settings.platform }}/kge.${{ matrix.settings.platform }}.node" \
             "native/kge.${{ matrix.settings.platform }}.node"
          node -e "const m=require('./index.js'); if(m.backend!=='native'){console.error('loader did not select native backend, got: '+m.backend);process.exit(1)}; console.log('loader parity OK: backend=native version='+m.version)"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kge-${{ matrix.settings.platform }}
          path: kge-artifacts/${{ matrix.settings.platform }}/*.node
          if-no-files-found: error

  publish:
    name: Publish KGE Packages
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Write the registry-verify helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'VERIFY'
          # verify_on_registry <pkg> <version>: poll the npm registry JSON until
          # the exact version is resolvable, or fail after ~3 minutes.
          verify_on_registry() {
            local pkg="$1" ver="$2"
            local enc="${pkg//\//%2f}"
            local url="https://registry.npmjs.org/${enc}"
            local tmp="$RUNNER_TEMP/reg.json"
            local i
            for i in $(seq 1 18); do
              if curl -sfL "$url" -o "$tmp"; then
                if REG_JSON="$tmp" REG_VER="$ver" node -e 'const d=require(process.env.REG_JSON); process.exit(d.versions && d.versions[process.env.REG_VER] ? 0 : 1)'; then
                  echo "verified ${pkg}@${ver} on the npm registry"
                  return 0
                fi
              fi
              echo "waiting for ${pkg}@${ver} to propagate (attempt ${i}/18)..."
              sleep 10
            done
            echo "::error::${pkg}@${ver} did not appear on the npm registry within ~3 minutes of publish"
            return 1
          }
          VERIFY

      - name: Assert exactly five platform binaries were built
        shell: bash
        run: |
          set -euo pipefail
          count=$(find artifacts -name "kge.*.node" -type f | wc -l | tr -d ' ')
          echo "found $count platform binaries"
          find artifacts -name "kge.*.node" -type f
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 platform binaries, found $count — refusing to publish a partial set"
            exit 1
          fi

      - name: Publish the five platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/verify.sh"
          VERSION=$(node -p "require('./npm/packages/kge/package.json').version")
          echo "Publishing platform packages at version: $VERSION (dry_run=$DRY_RUN)"

          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            NODE_FILE="artifacts/kge-${platform}/kge.${platform}.node"
            if [ ! -f "$NODE_FILE" ]; then
              echo "::error::missing binary for ${platform} at ${NODE_FILE}"
              exit 1
            fi

            case "$platform" in
              linux-x64-gnu)   OS="linux";  CPU="x64";   LIBC='"libc": ["glibc"],' ;;
              linux-arm64-gnu) OS="linux";  CPU="arm64"; LIBC='"libc": ["glibc"],' ;;
              darwin-x64)      OS="darwin"; CPU="x64";   LIBC="" ;;
              darwin-arm64)    OS="darwin"; CPU="arm64"; LIBC="" ;;
              win32-x64-msvc)  OS="win32";  CPU="x64";   LIBC="" ;;
            esac

            NODE_NAME="kge.${platform}.node"
            PKG_DIR="npm-pkg/kge-${platform}"
            mkdir -p "$PKG_DIR"
            cp "$NODE_FILE" "$PKG_DIR/$NODE_NAME"

            cat > "$PKG_DIR/package.json" <<EOF
          {
            "name": "@ruvector/kge-${platform}",
            "version": "${VERSION}",
            "os": ["${OS}"],
            "cpu": ["${CPU}"],
            ${LIBC}
            "main": "${NODE_NAME}",
            "files": ["${NODE_NAME}"],
            "description": "Holographic knowledge-graph embeddings (@ruvector/kge) - ${platform} native binary",
            "keywords": ["ruvector", "kge", "knowledge-graph", "embeddings", "napi-rs"],
            "author": "ruv.io Team <info@ruv.io>",
            "license": "MIT",
            "repository": {"type": "git", "url": "https://github.com/ruvnet/ruvector"},
            "engines": {"node": ">= 18"},
            "publishConfig": {"registry": "https://registry.npmjs.org/", "access": "public"}
          }
          EOF

            echo "=== @ruvector/kge-${platform}@${VERSION} ==="
            (
              cd "$PKG_DIR"
              if [ "$DRY_RUN" = "true" ]; then
                npm publish --access public --dry-run
              else
                if npm publish --access public; then
                  echo "npm publish returned success"
                else
                  echo "npm publish returned non-zero — verifying on the registry anyway"
                fi
              fi
            )
            if [ "$DRY_RUN" != "true" ]; then
              verify_on_registry "@ruvector/kge-${platform}" "$VERSION" || exit 1
            fi
          done

          echo "all five platform packages handled"

      - name: Publish the meta package (only after all five platforms verified)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/verify.sh"
          VERSION=$(node -p "require('./npm/packages/kge/package.json').version")

          # The loader (npm/packages/kge/index.js) has NO platform-package
          # fallback: it only require()s native/kge.<platform>.node from the meta
          # package itself, so the meta tarball must BUNDLE all five binaries.
          mkdir -p npm/packages/kge/native
          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            cp "artifacts/kge-${platform}/kge.${platform}.node" \
               "npm/packages/kge/native/kge.${platform}.node"
          done
          echo "bundled native binaries:"
          ls -la npm/packages/kge/native/*.node

          (
            cd npm/packages/kge
            npm install --no-audit --no-fund --no-workspaces --legacy-peer-deps
            npx -y -p typescript@5.9.3 tsc -p tsconfig.json
          )

          cd npm/packages/kge
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pack.txt"
            for f in dist/index.js native/kge.linux-x64-gnu.node native/kge.linux-arm64-gnu.node native/kge.darwin-x64.node native/kge.darwin-arm64.node native/kge.win32-x64-msvc.node; do
              if ! grep -q "$f" "$RUNNER_TEMP/pack.txt"; then
                echo "::error::dry-run tarball is missing $f"
                exit 1
              fi
            done
            echo "dry-run tarball contains dist/index.js and all five native binaries"
          else
            if npm publish --access public --ignore-scripts; then
              echo "npm publish returned success"
            else
              echo "npm publish returned non-zero — verifying on the registry anyway"
            fi
            verify_on_registry "@ruvector/kge" "$VERSION" || exit 1
          fi
