# rv-gateway (ADR-351 M1). workers.dev only: no routes, no custom domains.
# Deploys are gated; this file is not deployed by the scaffold workflow.
name = "ruvector-edge-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
account_id = "501c77f558c68152352b8ddfade9b854"
workers_dev = true

[build]
# Pinned: worker-build must match the worker crate (=0.8.5); an unpinned
# install pulls the latest release.
# `env -u RUSTFLAGS`: a host-wide RUSTFLAGS (e.g. `-C link-arg=-fuse-ld=mold`)
# breaks the wasm32 link.
command = "cargo install -q worker-build --version 0.8.5 --locked && env -u RUSTFLAGS worker-build --release"

# Edge AS JWKS is fetched ONLY through this binding: same-account
# workers.dev -> workers.dev subrequests over the internet are refused
# (Cloudflare 1042). Without the binding the gateway answers 503
# jwks_unavailable; it never falls back to a public fetch.
[[services]]
binding = "EDGE_AUTH"
service = "ruvector-edge-auth"

[vars]
# The trust root (public origin, edge issuer + JWKS URL, upstream issuer +
# JWKS URL, first-party auds, pinned upstream kids) is COMPILED into release
# builds (edge/gateway/src/trust_root.rs, ADR-351 §5.4 item 5). Do not add
# those names here: a release build that sees one with a different value
# answers 503 trust_root_mismatch. Only the §5.5 flag is a var; with the
# compiled (empty) FIRST_PARTY_AUDS / ACCEPTED_UPSTREAM_KIDS, "true" fails
# closed.
UPSTREAM_FIRST_PARTY = "false"

# ADR-351 §10 layer 2: Workers Rate Limiting, one binding per budget class
# (read / write / ops / mcp) and level (USER = `user:{tenant_key}:{sub}`,
# ORG = `org:{tenant_key}`). Limits are per 10 s window and per Cloudflare
# location. Must match `api::ratelimit::BUDGETS` (config tests check it);
# namespace_ids are unique to this Worker within the account.
[[ratelimits]]
name = "RL_READ_USER"
namespace_id = "35101"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_READ_ORG"
namespace_id = "35102"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RL_WRITE_USER"
namespace_id = "35103"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "RL_WRITE_ORG"
namespace_id = "35104"
simple = { limit = 50, period = 10 }

[[ratelimits]]
name = "RL_OPS_USER"
namespace_id = "35105"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_OPS_ORG"
namespace_id = "35106"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RL_MCP_USER"
namespace_id = "35107"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_MCP_ORG"
namespace_id = "35108"
simple = { limit = 100, period = 10 }

# ADR-351 §6: storage Durable Objects, SQLite-backed, addressed only by
# idFromName from this Worker (TenantLedger: hex(sha256("v1|" + tenant_key +
# "|ledger")); VectorShard: DoMeta::do_name()). No public route reaches them.
[[durable_objects.bindings]]
name = "TENANT_LEDGER"
class_name = "TenantLedger"

[[durable_objects.bindings]]
name = "VECTOR_SHARD"
class_name = "VectorShard"

# Append-only: never edit or reorder an applied tag (ADR-351 §16.4).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantLedger", "VectorShard"]
