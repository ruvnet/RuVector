# rv-gateway (ADR-351 M1). workers.dev only: no routes, no custom domains.
# Deploys are gated; this file is not deployed by the scaffold workflow.
name = "ruvector-edge-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
account_id = "501c77f558c68152352b8ddfade9b854"
workers_dev = true

[build]
# Pinned: worker-build must match the worker crate (=0.8.5); an unpinned
# install pulls the latest release.
# `env -u RUSTFLAGS`: a host-wide RUSTFLAGS (e.g. `-C link-arg=-fuse-ld=mold`)
# breaks the wasm32 link.
command = "cargo install -q worker-build --version 0.8.5 --locked && env -u RUSTFLAGS worker-build --release"

# Edge AS JWKS is fetched ONLY through this binding: same-account
# workers.dev -> workers.dev subrequests over the internet are refused
# (Cloudflare 1042). Without the binding the gateway answers 503
# jwks_unavailable; it never falls back to a public fetch.
[[services]]
binding = "EDGE_AUTH"
service = "ruvector-edge-auth"

[vars]
# The trust root (public origin, edge issuer + JWKS URL, upstream issuer +
# JWKS URL, first-party auds, pinned upstream kids) is COMPILED into release
# builds (edge/gateway/src/trust_root.rs, ADR-351 §5.4 item 5). Do not add
# those names here: a release build that sees one with a different value
# answers 503 trust_root_mismatch. Only the §5.5 flag is a var; with the
# compiled (empty) FIRST_PARTY_AUDS / ACCEPTED_UPSTREAM_KIDS, "true" fails
# closed.
UPSTREAM_FIRST_PARTY = "false"

# ADR-351 §10 layer 2: Workers Rate Limiting, one binding per budget class
# (read / write / ops / mcp) and level (USER = `user:{tenant_key}:{sub}`,
# ORG = `org:{tenant_key}`). Limits are per 10 s window and per Cloudflare
# location. Must match `api::ratelimit::BUDGETS` (config tests check it);
# namespace_ids are unique to this Worker within the account.
[[ratelimits]]
name = "RL_READ_USER"
namespace_id = "35101"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_READ_ORG"
namespace_id = "35102"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RL_WRITE_USER"
namespace_id = "35103"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "RL_WRITE_ORG"
namespace_id = "35104"
simple = { limit = 50, period = 10 }

[[ratelimits]]
name = "RL_OPS_USER"
namespace_id = "35105"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_OPS_ORG"
namespace_id = "35106"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RL_MCP_USER"
namespace_id = "35107"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_MCP_ORG"
namespace_id = "35108"
simple = { limit = 100, period = 10 }

# ADR-351 §6: storage Durable Objects, SQLite-backed, addressed only by
# idFromName from this Worker (TenantLedger: hex(sha256("v1|" + tenant_key +
# "|ledger")); VectorShard: DoMeta::do_name()). No public route reaches them.
[[durable_objects.bindings]]
name = "TENANT_LEDGER"
class_name = "TenantLedger"

[[durable_objects.bindings]]
name = "VECTOR_SHARD"
class_name = "VectorShard"

# ADR-351 M4 (§3 rv-quant / rv-graph / rv-mincut): same addressing rule
# (idFromName of a name derived from the verified tenant key: QuantShard
# DoMeta(service = quant), GraphStore / AnalyticsJob do_name(tenant,
# graph | mincut, uid(name | job id), 0)); no public route reaches them.
[[durable_objects.bindings]]
name = "QUANT_SHARD"
class_name = "QuantShard"

[[durable_objects.bindings]]
name = "GRAPH_STORE"
class_name = "GraphStore"

[[durable_objects.bindings]]
name = "ANALYTICS_JOB"
class_name = "AnalyticsJob"

# Append-only: never edit or reorder an applied tag (ADR-351 §16.4).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantLedger", "VectorShard"]

# ADR-351 §3 rv-registry (M5): the global scope directory (one object,
# idFromName("v1|registry|root")) and one registry index per @scope
# (idFromName(hex(sha256("v1|registry|" + scope)))). SQLite-backed, reachable
# only from this Worker; RegistryScope runs its sweep from a DO alarm.
[[durable_objects.bindings]]
name = "REGISTRY_ROOT"
class_name = "RegistryRoot"

[[durable_objects.bindings]]
name = "REGISTRY_SCOPE"
class_name = "RegistryScope"

# Distinct tag so a merge with other milestones' migrations reconciles
# ordering instead of colliding on a name. (M3 adds no Durable Object
# class: its tables live in TenantLedger / VectorShard behind `/m3`.)
[[migrations]]
tag = "v2-registry"
new_sqlite_classes = ["RegistryRoot", "RegistryScope"]

# M4 classes (ADR-351 §3 rv-quant / rv-graph / rv-mincut). Appended after the
# applied v1 and v2-registry tags; this tag only ever adds these three classes.
[[migrations]]
tag = "v-m4-quant-graph"
new_sqlite_classes = ["QuantShard", "GraphStore", "AnalyticsJob"]

# ONE bucket binding for every server-derived key prefix (ADR-351 §6.3):
# M5 RVF package blobs, registry upload staging (R2 multipart) and manifest
# mirrors; M3 snapshots/, exports/, staging/ (import uploads) and audit/ per
# tenant. Lifecycle (bucket rules): exports/ expire after 1 day, incomplete
# multipart uploads abort after 7 days; staging/ has NO rule yet (it is
# shared with the M5 registry sweep), so unconsumed M3 uploads stay.
[[r2_buckets]]
binding = "EDGE_DATA"
bucket_name = "ruvector-edge-data"

# ---- M3 (ADR-351 §6.3, §6.5, §3 rv-snapshot / rv-ingest / rv-embed) ----
# Bulk-import jobs: {tenant_key, job_id}. One bounded step per delivery (a
# slice of the upload's sha256 pass, or a few batches); the job persists its
# hasher state / cursor after every step and re-enqueues itself, so retries
# resume and every invocation stays within the default CPU limit. A job
# whose deliveries commit nothing 15 times in a row is failed (and its upload
# released) before its message would reach the DLQ; one that still lands
# there resumes by re-sending the same {tenant_key, job_id} to
# ruvector-edge-ingest (jobs older than the 24 h op_id window since
# submission are failed, never replayed).
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "ruvector-edge-ingest"

[[queues.consumers]]
queue = "ruvector-edge-ingest"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 20
# 20 × 30 s ≫ the 120 s pending op_id TTL: a batch reserved by a killed
# invocation frees up long before the retries run out.
retry_delay = 30
dead_letter_queue = "ruvector-edge-ingest-dlq"

# Audit events → one hash chain per tenant (in its ledger), NDJSON objects
# audit/{tenant_key}/{yyyy}/{mm}/{dd}/{seq:012}.ndjson.
[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "ruvector-edge-audit"

[[queues.consumers]]
queue = "ruvector-edge-audit"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 10
# Rides out a short R2 / ledger outage (every step is idempotent).
retry_delay = 30
dead_letter_queue = "ruvector-edge-audit-dlq"

# rv-embed: @cf/baai/bge-small-en-v1.5 (384 dims), only for collections
# created with embedder = "bge-small-en-v1.5".
[ai]
binding = "AI"
