[package]
name = "ruvector-edge-gateway"
description = "rv-gateway Worker (ADR-351 M1): /v1/health, RFC 9728 metadata, /v1/me, REST collections/vectors, /v1/ops and /v1/mcp over TenantLedger / VectorShard Durable Objects; accepts only edge-auth-issued, resource-bound ES256 tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ruvector-edge-auth = { workspace = true }
ruvector-edge-tenancy = { workspace = true }
# Storage core behind the TenantLedger / VectorShard Durable Objects
# (ADR-351 §6, §16), consumed by path like the other cores.
ruvector-edge-store = { path = "../../crates/ruvector-edge-store" }
# RVF package registry core (ADR-351 §3 rv-registry, M5) behind the
# RegistryRoot / RegistryScope Durable Objects.
ruvector-edge-registry = { path = "../../crates/ruvector-edge-registry" }
hex = "0.4"
sha2 = { workspace = true }
# Bounded body reads (ADR-351 §10 layer 1): stop at 1 MiB while streaming.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# EntropySource for collection_uid nonces (crypto.getRandomValues).
getrandom = { workspace = true }

[features]
default = []
# Integration-test issuer override (ADR §9.3). Never enabled in release builds.
dev-issuer = []

[dev-dependencies]
p256 = { workspace = true }
# Cross-crate end-to-end tests: tokens minted and exchanged by the real AS
# core are verified and served by the gateway (native only; never in wasm).
ruvector-edge-authz = { workspace = true }
# M5 acceptance: real `.rvf` files written by the rvf CLI engine (native only).
rvf-runtime = { path = "../../crates/rvf/rvf-runtime" }
tempfile = "3"
